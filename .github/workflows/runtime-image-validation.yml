name: Installed-image validator

on:
  pull_request:
    paths:
      - 'tools/bazel/tests/migrated_job_cleanup_test.py'
      - .github/actions/bazel-post-job-cleanup/**
      - tools/bazel/ci/cleanup_container_bazel.py
      - tools/bazel/tests/container_bazel_cleanup_test.py
      - tools/bazel/ci/validate_runtime.py
      - tools/bazel/tests/runtime_validation_test.py
      - tools/bazel/tests/installed_images_test.py
      - tools/bazel/tests/image_workflow_test.py
      - tools/bazel/ci/verify_vs_oci.sh
      - tools/bazel/private_server.sh
      - tools/bazel/tests/dhcp_relay_make_test.py
      - tools/bazel/ci/verify_dhcp_relay.py
      - rules/docker-dhcp-relay.mk
      - tools/bazel/tests/vs_oci_session_test.py
      - tools/bazel/oci/oci_inventory.py
      - tools/bazel/tests/integration/oci_inventory_test.py
      - tools/bazel/tests/integration/oci_image_test.py
      - .github/workflows/bazel-oci.yml
      - .github/workflows/bazel-base-images.yml
      - tools/bazel/oci/runtime_smoke.py
      - tools/bazel/oci/tests/runtime_smoke_test.py
      - tools/bazel/oci/RUNTIME_VALIDATION.md
      - .github/workflows/runtime-image-validation.yml
  push:
    branches: [master]
    paths:
      - 'tools/bazel/tests/migrated_job_cleanup_test.py'
      - .github/actions/bazel-post-job-cleanup/**
      - tools/bazel/ci/cleanup_container_bazel.py
      - tools/bazel/tests/container_bazel_cleanup_test.py
      - tools/bazel/ci/validate_runtime.py
      - tools/bazel/tests/runtime_validation_test.py
      - tools/bazel/tests/installed_images_test.py
      - tools/bazel/tests/image_workflow_test.py
      - tools/bazel/ci/verify_vs_oci.sh
      - tools/bazel/private_server.sh
      - tools/bazel/tests/dhcp_relay_make_test.py
      - tools/bazel/ci/verify_dhcp_relay.py
      - rules/docker-dhcp-relay.mk
      - tools/bazel/tests/vs_oci_session_test.py
      - tools/bazel/oci/oci_inventory.py
      - tools/bazel/tests/integration/oci_inventory_test.py
      - tools/bazel/tests/integration/oci_image_test.py
      - .github/workflows/bazel-oci.yml
      - .github/workflows/bazel-base-images.yml
      - tools/bazel/oci/runtime_smoke.py
      - tools/bazel/oci/tests/runtime_smoke_test.py
      - tools/bazel/oci/RUNTIME_VALIDATION.md
      - .github/workflows/runtime-image-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    name: Native validator tests (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: [self-hosted, Linux, X64, ubuntu-x64]
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - &restore_workspace_access
        name: Restore workspace access before checkout
        if: runner.environment == 'self-hosted'
        working-directory: ${{ runner.temp }}
        shell: bash
        env:
          RUNNER_PIPELINE_WORKSPACE: ${{ runner.workspace }}
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY##*/}"
          pipeline_workspace="${RUNNER_PIPELINE_WORKSPACE%/}"
          expected="$pipeline_workspace/$repository"
          if [[ "$GITHUB_WORKSPACE" != "$expected" ]]; then
            printf 'Refusing permission repair: expected workspace %s, got %s.\n' \
              "$expected" "$GITHUB_WORKSPACE" >&2
            exit 1
          fi
          if [[ ! -e "$expected" && ! -L "$expected" ]]; then
            echo 'No existing workspace to repair.'
            exit 0
          fi
          work_root="$(realpath -e -- "$pipeline_workspace/..")"
          physical_workspace="$work_root/$repository/$repository"
          if [[ ! -d "$expected" || "$(realpath -e -- "$expected")" != "$physical_workspace" ]]; then
            echo 'Refusing permission repair on a redirected workspace.' >&2
            exit 1
          fi
          expected="$physical_workspace"
          owner="$(id -u):$(id -g)"
          sudo -n find -P "$expected" -xdev -type d \
            -exec chown --no-dereference -- "$owner" {} +
          sudo -n find -P "$expected" -xdev -type d \
            -exec chmod u+rwx -- {} +
          sudo -n find -P "$expected" -xdev -type f -links 1 \
            -exec chown --no-dereference -- "$owner" {} +
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Register post-job cleanup
        id: runner_cleanup
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/bazel-post-job-cleanup
        with:
          migrated-job: 'true'
      - name: Install tools for the small native test library
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc binutils gdb
      - name: Check loading, matching debug symbols and container guards
        run: |
          for tool in cc objcopy readelf gdb; do command -v "$tool"; done
          env -u PYTHONSAFEPATH /usr/bin/python3 -B -m unittest \
            tools.bazel.oci.tests.runtime_smoke_test \
            tools.bazel.tests.runtime_validation_test \
            tools.bazel.tests.installed_images_test \
            tools.bazel.tests.dhcp_relay_make_test \
            tools.bazel.tests.vs_oci_session_test \
            tools.bazel.tests.integration.oci_inventory_test \
            tools.bazel.tests.integration.oci_image_test \
            tools.bazel.tests.container_bazel_cleanup_test \
            tools.bazel.tests.migrated_job_cleanup_test \
            tools.bazel.tests.image_workflow_test -v
          /usr/bin/python3 -B tools/bazel/ci/validate_runtime.py --help
      - name: Record post-job cleanup eligibility
        if: always() && steps.runner_cleanup.outcome == 'success'
        env:
          BAZEL_CLEANUP_STEPS: ${{ toJSON(steps) }}
          BAZEL_CLEANUP_JOB_STATUS: ${{ job.status }}
          BAZEL_CLEANUP_UPLOAD_STEPS: '[]'
        run: python3 -B -m tools.bazel.ci.cleanup_container_bazel --migrated-job --mark-artifacts
