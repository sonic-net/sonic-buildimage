  p4rt_native:
    name: Build and inspect P4RT images (AMD64)
    if: github.event_name != 'workflow_dispatch' || inputs.source_image == 'none'
    # P4RT keeps two Bazel output bases and the finished OCI archives on the VS build pool.
    runs-on: [self-hosted, linux, bazel-x64, vs]
    timeout-minutes: 360
    container:
      image: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
      options: --init
    env:
      BAZEL: ${{ github.workspace }}/tools/bazel/ci/libteam_draft_bazel.sh
      P4RT_TRUSTED_CACHE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install execution tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf automake binutils binutils-gold build-essential busybox ca-certificates gdb git j2cli jq libtool libxml2 pkg-config python3 python3-jinja2 python3-yaml tar unzip zstd
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bind the tested checkout identity
        id: checkout_identity
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -B tools/bazel/ci/checkout_identity.py \
            --expected-revision "$GITHUB_SHA" --event-name "$GITHUB_EVENT_NAME" \
            --head-sha "$EVENT_HEAD_SHA" --event-base-sha "$EVENT_BASE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Configure remote cache uploads
        env:
          UPLOAD_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          printf '\nbuild --remote_upload_local_results=%s\n' \
            "$UPLOAD_CACHE" >> .bazelrc.user

      - name: Check native architecture and generated dependency state
        run: |
          test "$(uname -m)" = "x86_64"
          test ! -e MODULE.bazel.lock
          test -z "$(git ls-files -- MODULE.bazel.lock)"
          git check-ignore MODULE.bazel.lock

      - name: Register post-job Bazel cleanup
        id: bazel_cleanup_register
        uses: ./.github/actions/bazel-post-job-cleanup
      - name: Initialize P4RT's pinned source owner
        run: git submodule update --init -- src/sonic-p4rt/sonic-pins
      - name: Install P4RT source execution dependencies
        run: |
          apt-get install -y --no-install-recommends bison flex libfl-dev libgmp-dev patch zip \
            libarchive-tools libhiredis-dev libnl-3-dev libnl-genl-3-dev libnl-nf-3-dev \
            libnl-route-3-dev libzmq3-dev libboost-serialization-dev nlohmann-json3-dev uuid-dev
          git config --global --add safe.directory "$GITHUB_WORKSPACE/src/sonic-p4rt/sonic-pins"
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: p4rt-native-amd64
          cache-version: "8.5.1"
      - name: Configure Bazel action memory budget
        run: python3 -B tools/bazel/ci/resources.py --configure
      - name: Preserve setup-bazel caches and enable the pool service for trusted sources
        if: env.P4RT_TRUSTED_CACHE == 'true'
        run: python3 tools/bazel/ci/preserve_setup_bazel_cache.py --private-remote-cache
      - name: Preserve local setup-bazel caches for fork builds
        if: env.P4RT_TRUSTED_CACHE != 'true'
        run: python3 tools/bazel/ci/preserve_setup_bazel_cache.py
      - name: Restore default Bazel startup ownership
        run: python3 tools/bazel/ci/repair_bazel_startup.py

      - name: Configure shared source download mirrors
        run: |
          python3 -B tools/bazel/ci/source_mirrors.py \
            --output "$RUNNER_TEMP/sonic-source-mirrors.cfg"
          # common.bazelrc imports this ignored file, including through Draft wrappers.
          printf 'common --downloader_config=%s\n' "$RUNNER_TEMP/sonic-source-mirrors.cfg" >> .bazelrc.user

      - name: Allocate fresh P4RT build and owner output paths
        id: p4rt_storage
        run: |
          scratch=$(mktemp -d "$SONIC_BAZEL_JOB_TEMP/p4rt.XXXXXXXX")
          printf 'scratch=%s\n' "$scratch" >> "$GITHUB_OUTPUT"
          python3 - "$scratch" <<'PYSPACE'
          from pathlib import Path
          import shutil, sys
          path = Path(sys.argv[1])
          free = shutil.disk_usage(path).free
          print(f"P4RT scratch has {free / 1024**3:.1f} GiB available for both Bazel output bases and archives")
          if free < 90 * 1024**3:
              raise SystemExit("P4RT requires 90 GiB of free build space")
          PYSPACE
          printf 'P4RT_SCRATCH=%s\nP4RT_ARTIFACTS=%s/artifacts\n' "$scratch" "$scratch" >> "$GITHUB_ENV"
          df -h "$scratch" "$GITHUB_WORKSPACE"
      - name: Bound P4RT build phases and verify execution tools
        run: |
          for tool in bsdtar gdb readelf objcopy make git python3 zip bison flex g++ pkg-config; do
            command -v "$tool" >/dev/null
          done
          PYTHONPATH="$PWD" python3 -B - <<'PYLAUNCH'
          import os, shlex, shutil
          from pathlib import Path
          from tools.bazel.ci.preserve_setup_bazel_cache import write_bazel6_owner_rc
          real = shutil.which("bazel")
          if not real:
              raise SystemExit("Bazelisk is unavailable")
          directory = Path(os.environ["P4RT_SCRATCH"]) / "bazel-bin"
          directory.mkdir()
          owner_rc = directory.parent / "p4rt-owner.bazelrc"
          write_bazel6_owner_rc(owner_rc, Path.home(), Path(os.environ["RUNNER_TEMP"]) / "sonic-source-mirrors.cfg",
                                private_remote_cache=os.environ["P4RT_TRUSTED_CACHE"] == "true")
          for name, heap in (("bazel", "3g"), ("owner", "2g")):
              path = directory / name
              if name == "owner":
                  # Retain the PINS workspace rc and its split-DWARF configuration.
                  startup = " --nosystem_rc --nohome_rc --bazelrc=" + shlex.quote(str(owner_rc))
              else:
                  startup = " --output_base=" + shlex.quote(str(directory.parent / "root-output-base"))
              path.write_text("#!/bin/sh\nset -eu\n"
                  'if [ "$#" -eq 1 ] && [ "$1" = --version ]; then\n'
                  "  exec " + shlex.quote(real) + ' "$@"\nfi\n'
                  "exec " + shlex.quote(real) + startup + " --host_jvm_args=-Xmx" + heap + ' "$@"\n')
              path.chmod(0o755)
          with Path(os.environ["GITHUB_ENV"]).open("a") as output:
              output.write("P4RT_OWNER_BAZEL=" + str(directory / "owner") + "\n")
          with Path(os.environ["GITHUB_PATH"]).open("a") as output:
              output.write(str(directory) + "\n")
          PYLAUNCH
      - name: Check P4RT storage before SDK preparation
        run: df -h / "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: Prepare matching Common SDK and source-owned P4RT TARs
        run: |
          python3 -B tools/bazel/ci/p4rt_image.py prepare-owner --bazel "$BAZEL" \
            --directory "$P4RT_ARTIFACTS" --owner-source src/sonic-p4rt/sonic-pins \
            --owner-revision "$(git rev-parse HEAD:src/sonic-p4rt/sonic-pins)" \
            --owner-output-base "$P4RT_SCRATCH/owner-output-base" --owner-bazel "$P4RT_OWNER_BAZEL" --jobs 2
      - name: Check P4RT storage before image build
        run: df -h / "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: Build P4RT runtime and debug images
        run: |
          python3 -B tools/bazel/ci/p4rt_image.py build --bazel "$BAZEL" \
            --directory "$P4RT_ARTIFACTS" --owner-source src/sonic-p4rt/sonic-pins \
            --owner-revision "$(git rev-parse HEAD:src/sonic-p4rt/sonic-pins)" \
            --owner-output-base "$P4RT_SCRATCH/owner-output-base"
      - name: Check P4RT storage before image validation
        run: df -h / "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: Validate P4RT image contents and cache reuse
        run: |
          python3 -B tools/bazel/ci/p4rt_validate.py validate --directory "$P4RT_ARTIFACTS" \
            --owner-source src/sonic-p4rt/sonic-pins --bazel "$BAZEL"
          python3 -B tools/bazel/ci/p4rt_validate.py incremental --directory "$P4RT_ARTIFACTS" \
            --owner-source src/sonic-p4rt/sonic-pins --bazel "$BAZEL"
      - name: Run all original P4RT tests against the selected image SDK
        run: |
          for phase in prepare-owner-runtime owner-tests; do
            python3 -B tools/bazel/ci/p4rt_image.py "$phase" --bazel "$BAZEL" \
              --directory "$P4RT_ARTIFACTS" --owner-source src/sonic-p4rt/sonic-pins \
              --owner-revision "$(git rev-parse HEAD:src/sonic-p4rt/sonic-pins)" \
              --owner-output-base "$P4RT_SCRATCH/owner-output-base" --owner-bazel "$P4RT_OWNER_BAZEL" --jobs 2
          done
      - name: Prepare reviewed P4RT public evidence
        id: p4rt_public
        if: always() && steps.p4rt_storage.outcome == 'success'
        run: python3 -B tools/bazel/ci/p4rt_public.py --directory "$P4RT_ARTIFACTS"
      - name: Retain P4RT images and acceptance evidence
        id: bazel_upload_p4rt_public
        if: always() && steps.p4rt_public.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p4rt-images-amd64-${{ github.sha }}
          path: ${{ env.P4RT_ARTIFACTS }}/public
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Authorize published artifacts for post-job cleanup
        if: always() && steps.bazel_cleanup_register.outcome == 'success'
        env:
          BAZEL_CLEANUP_STEPS: ${{ toJSON(steps) }}
        run: python3 -B -m tools.bazel.ci.cleanup_container_bazel --mark-artifacts

  p4rt_runtime:
    name: Load and run P4RT images (AMD64)
    needs: p4rt_native
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Bind the tested checkout identity
        id: checkout_identity
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -B tools/bazel/ci/checkout_identity.py \
            --expected-revision "$GITHUB_SHA" --event-name "$GITHUB_EVENT_NAME" \
            --head-sha "$EVENT_HEAD_SHA" --event-base-sha "$EVENT_BASE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Initialize P4RT's pinned probe owner
        run: git submodule update --init -- src/sonic-p4rt/sonic-pins
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: p4rt-images-amd64-${{ github.sha }}
          path: artifacts/p4rt
      - name: Check installed P4RT startup, ConfigDB and software RPCs
        run: |
          python3 -B tools/bazel/ci/p4rt_loaded.py --release-downloaded-inputs --directory artifacts/p4rt \
            --owner-source src/sonic-p4rt/sonic-pins
      - name: Verify source, SDK, owner tests and both image receipts
        run: python3 -B tools/bazel/ci/p4rt_acceptance.py --directory artifacts/p4rt
      - name: Retain installed P4RT evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p4rt-installed-amd64-${{ github.sha }}
          path: artifacts/p4rt/*.runtime.json
          if-no-files-found: error
          retention-days: 14

  gearbox_archive:
    name: Gearbox archive (AMD64)
    if: github.event_name != 'workflow_dispatch' || inputs.source_image == 'none'
    # Use the VS build pool for the Syncd debug layer and both Gearbox archives.
    runs-on: [self-hosted, linux, bazel-x64, vs]
    timeout-minutes: 360
    container:
      image: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
      options: --init
    env:
      # Shared CI entry point with the canonical registry; the full Make VS job is separate.
      BAZEL: ${{ github.workspace }}/tools/bazel/ci/libteam_draft_bazel.sh
    defaults:
      run:
        shell: bash
    steps:
      - name: Install execution tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf automake binutils binutils-gold build-essential busybox ca-certificates gdb git j2cli jq libarchive-tools libtool libxml2 pkg-config python3 python3-jinja2 python3-yaml tar unzip zstd
          for tool in bsdtar gdb readelf objcopy; do
            command -v "$tool"
          done

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bind the tested checkout identity
        id: checkout_identity
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -B tools/bazel/ci/checkout_identity.py \
            --expected-revision "$GITHUB_SHA" --event-name "$GITHUB_EVENT_NAME" \
            --head-sha "$EVENT_HEAD_SHA" --event-base-sha "$EVENT_BASE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Configure remote cache uploads
        env:
          UPLOAD_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          printf '\nbuild --remote_upload_local_results=%s\n' \
            "$UPLOAD_CACHE" >> .bazelrc.user

      - name: Check native architecture and generated dependency state
        run: |
          test "$(uname -m)" = "x86_64"
          test ! -e MODULE.bazel.lock
          test -z "$(git ls-files -- MODULE.bazel.lock)"
          git check-ignore MODULE.bazel.lock

      - name: Prepare pinned submodules for image builds
        run: bash tools/bazel/ci/prepare_image_submodules.sh
      - name: Register post-job Bazel cleanup
        id: bazel_cleanup_register
        uses: ./.github/actions/bazel-post-job-cleanup
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: gbsyncd-amd64
          cache-version: "8.5.1"
      - name: Configure Bazel action memory budget
        run: python3 -B tools/bazel/ci/resources.py --configure
      - name: Preserve setup-bazel caches for source checks
        run: python3 tools/bazel/ci/preserve_setup_bazel_cache.py --private-remote-cache
      - name: Restore default Bazel startup ownership
        run: python3 tools/bazel/ci/repair_bazel_startup.py

      - name: Configure shared source download mirrors
        run: |
          python3 -B tools/bazel/ci/source_mirrors.py \
            --output "$RUNNER_TEMP/sonic-source-mirrors.cfg"
          # common.bazelrc imports this ignored file, including through Draft wrappers.
          printf 'common --downloader_config=%s\n' "$RUNNER_TEMP/sonic-source-mirrors.cfg" >> .bazelrc.user

      - name: Check the gbsyncd Make handoff
        run: python3 -B tools/bazel/tests/gbsyncd_make_test.py

      - name: Test gearbox image validation
        run: python3 -B -m unittest tools.bazel.tests.gbsyncd_image_test

      - name: Build gearbox runtime and debug images from source packages
        id: gearbox_build
        env:
          BAZELISK_GITHUB_TOKEN: ""
          CI_HEAD_SHA: ${{ steps.checkout_identity.outputs.head_sha }}
          CI_BASE_SHA: ${{ steps.checkout_identity.outputs.base_sha }}
        run: python3 -B tools/bazel/ci/gbsyncd_image.py build --bazel "$BAZEL" --artifacts artifacts/gbsyncd
      - name: Validate gearbox installed contents and complete source symbols
        run: python3 -B tools/bazel/ci/gbsyncd_image.py validate --artifacts artifacts/gbsyncd
      - name: Verify gearbox no-op, configuration edit and restored archives
        run: python3 -B tools/bazel/ci/gbsyncd_image.py incremental --bazel "$BAZEL" --artifacts artifacts/gbsyncd
      - name: Review public gearbox evidence
        id: gearbox_public
        if: always() && steps.gearbox_build.outcome != 'skipped'
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          from tools.bazel.ci.public_artifacts import safe_json, dependency_json
          root = Path('artifacts/gbsyncd')
          public_json = (
              'validation.json', 'source-contract.json', 'source-receipt.json', 'policy.json',
              'runtime-apt.json', 'debug-apt.json', 'runtime-packages.json', 'debug-packages.json',
              'base-packages.json', 'config-engine-packages.json', 'action-audit.json', 'incremental.json',
          )
          for name in public_json:
              path = root / name
              if path.exists():
                  value = json.loads(path.read_text())
                  if name == 'policy.json':
                      # Only this declared image setting is public.
                      assert value['image_validation'].pop('environment') == {'DEBIAN_FRONTEND': 'noninteractive'}
                  safe_json(value)
          for name, kind in (('MODULE.bazel.lock', 'lock'), ('module-graph.json', 'graph')):
              path = root / name
              if path.exists():
                  dependency_json(json.loads(path.read_text()), kind)
          receipt = root / 'build-receipt.json'
          if receipt.exists():
              source = json.loads(receipt.read_text())
              public = {key: source[key] for key in ('status', 'revision', 'architecture', 'image_version', 'artifacts', 'tested_revision_parents') if key in source}
              safe_json(public)
              (root / 'public-receipt.json').write_text(json.dumps(public, indent=2) + '\n')
          PYCODE
      - name: Retain gearbox archives and source evidence
        id: bazel_upload_gearbox_public
        if: always() && steps.gearbox_public.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gbsyncd-source-amd64-${{ github.sha }}
          path: |
            artifacts/gbsyncd/source-excludes.txt
            artifacts/gbsyncd/source-includes.txt
            artifacts/gbsyncd/*.gz
            artifacts/gbsyncd/*.tar
            artifacts/gbsyncd/validation.json
            artifacts/gbsyncd/source-contract.json
            artifacts/gbsyncd/source-receipt.json
            artifacts/gbsyncd/policy.json
            artifacts/gbsyncd/runtime-apt.json
            artifacts/gbsyncd/debug-apt.json
            artifacts/gbsyncd/runtime-packages.json
            artifacts/gbsyncd/debug-packages.json
            artifacts/gbsyncd/base-packages.json
            artifacts/gbsyncd/config-engine-packages.json
            artifacts/gbsyncd/*.status
            artifacts/gbsyncd/public-receipt.json
            artifacts/gbsyncd/action-audit.json
            artifacts/gbsyncd/incremental.json
            artifacts/gbsyncd/MODULE.bazel.lock
            artifacts/gbsyncd/module-graph.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: Authorize published artifacts for post-job cleanup
        if: always() && steps.bazel_cleanup_register.outcome == 'success'
        env:
          BAZEL_CLEANUP_STEPS: ${{ toJSON(steps) }}
        run: python3 -B -m tools.bazel.ci.cleanup_container_bazel --mark-artifacts

  gearbox_runtime:
