            artifacts/otel/otel-debug.packages.json
            artifacts/otel/base.packages.json
            artifacts/otel/config-engine.packages.json
            artifacts/otel/otel.status
            artifacts/otel/otel-debug.status
            artifacts/otel/*.validation.json
            artifacts/otel/validation.json
            artifacts/otel/public-receipt.json
            artifacts/otel/action-audit.json
            artifacts/otel/owner-action-audit.json
            artifacts/otel/incremental.json
            artifacts/otel/MODULE.bazel.lock
            artifacts/otel/module-graph.json
            artifacts/otel/tests/**/test.xml
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

