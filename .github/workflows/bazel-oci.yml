        env:
          BAZEL_CLEANUP_STEPS: ${{ toJSON(steps) }}
          BAZEL_CLEANUP_JOB_STATUS: ${{ job.status }}
          BAZEL_CLEANUP_UPLOAD_STEPS: '["runner_cleanup_upload_0", "runner_cleanup_upload_1", "runner_cleanup_upload_2"]'
