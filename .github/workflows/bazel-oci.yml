            umask 077
            preserved="$(mktemp -d "$RUNNER_TEMP/pre-orchagent-runtime-artifacts.XXXXXXXX")"
            mv artifacts "$preserved/artifacts"
            printf 'Completed sFlow runtime evidence preserved at %s/artifacts\n' "$preserved"
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: orchagent-source-amd64
          path: artifacts/orchagent-download
      - name: Exercise installed Orchagent and source Scapy variants
        env:
          CI_HEAD_SHA: ${{ steps.checkout_identity.outputs.head_sha }}
          CI_BASE_SHA: ${{ steps.checkout_identity.outputs.base_sha }}
        run: |
          # The producer publishes two source directories; select its image evidence explicitly.
          python3 -B tools/bazel/ci/orchagent_loaded.py --artifacts artifacts/orchagent-download/orchagent
      - name: Retain installed Orchagent evidence
        id: runner_cleanup_upload_2
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orchagent-runtime-amd64
