          import shutil
          owner_root = Path('bazel-testlogs/external/otelcol-contrib+')
          matches = list(owner_root.rglob('test.xml'))
          assert len(matches) == 3, matches
          for xml in matches:
              directory = Path('artifacts/otel/tests') / xml.parent.relative_to(owner_root)
              directory.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(xml, directory / 'test.xml')
