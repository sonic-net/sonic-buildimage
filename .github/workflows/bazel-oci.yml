        if: contains(fromJSON(steps.bundles.outputs.matrix).include.*.image, 'docker-sonic-gnmi')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundles.outputs.prefix }}-docker-sonic-gnmi
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/containers/docker-sonic-gnmi/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Publish docker-sonic-mgmt-framework for validation
        if: contains(fromJSON(steps.bundles.outputs.matrix).include.*.image, 'docker-sonic-mgmt-framework')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundles.outputs.prefix }}-docker-sonic-mgmt-framework
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/containers/docker-sonic-mgmt-framework/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Publish docker-sonic-otel for validation
        if: contains(fromJSON(steps.bundles.outputs.matrix).include.*.image, 'docker-sonic-otel')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundles.outputs.prefix }}-docker-sonic-otel
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/containers/docker-sonic-otel/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Publish docker-sonic-p4rt for validation
        if: contains(fromJSON(steps.bundles.outputs.matrix).include.*.image, 'docker-sonic-p4rt')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundles.outputs.prefix }}-docker-sonic-p4rt
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/containers/docker-sonic-p4rt/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Publish docker-swss-layer-trixie for validation
        if: contains(fromJSON(steps.bundles.outputs.matrix).include.*.image, 'docker-swss-layer-trixie')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundles.outputs.prefix }}-docker-swss-layer-trixie
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/containers/docker-swss-layer-trixie/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Publish docker-syncd-vs for validation
        if: contains(fromJSON(steps.bundles.outputs.matrix).include.*.image, 'docker-syncd-vs')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundles.outputs.prefix }}-docker-syncd-vs
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/containers/docker-syncd-vs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Publish docker-sysmgr for validation
        if: contains(fromJSON(steps.bundles.outputs.matrix).include.*.image, 'docker-sysmgr')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundles.outputs.prefix }}-docker-sysmgr
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/containers/docker-sysmgr/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Publish docker-teamd for validation
        if: contains(fromJSON(steps.bundles.outputs.matrix).include.*.image, 'docker-teamd')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundles.outputs.prefix }}-docker-teamd
          path: vs-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/vs/containers/docker-teamd/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Remove only this job's build containers
        id: vs_container_cleanup
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          containers=$(docker ps --all --quiet --filter "label=$SONIC_CI_CONTAINER_LABEL")
          while IFS= read -r container; do
            test -n "$container" || continue
            if ! docker rm --force "$container"; then
              remaining=$(docker ps --all --quiet \
                --filter "label=$SONIC_CI_CONTAINER_LABEL" --filter "id=$container")
              if test -n "$remaining"; then
                printf 'Unable to remove job container: %s\n' "$container" >&2
                exit 1
              fi
              printf 'Job container already removed: %s\n' "$container"
            fi
          done <<< "$containers"

      - name: Log out of the slave image registry
        if: always()
        working-directory: ${{ runner.temp }}
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          status=0
          docker logout "$REGISTRY_SERVER:$REGISTRY_PORT" || status=$?
          rm -f -- "${DOCKER_CONFIG:?}/config.json"
          exit "$status"

      - name: Remove only this run's checkout
        if: >-
          always() && steps.vs_container_cleanup.outcome == 'success' &&
          steps.vs_image_timings_upload.outcome == 'success' &&
          steps.vs_receipts_upload.outcome == 'success' &&
          !failure() &&
          (steps.vs_installer_upload.outcome == 'success' ||
           steps.vs_installer_upload.outcome == 'skipped')
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          checkout="$GITHUB_WORKSPACE/vs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if test -L "$checkout"; then
            printf 'Refusing redirected VS checkout: %s\n' "$checkout" >&2
            exit 1
          fi
          if test ! -e "$checkout"; then
            printf 'No VS checkout to remove: %s\n' "$checkout"
            exit 0
          fi
          python3 -B "$checkout/tools/bazel/ci/cleanup_vs_workspace.py" \
            --workspace "$GITHUB_WORKSPACE" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"

  installer_validation:
    name: Validate the published VS installer (AMD64)
    needs: vs_container
    runs-on: [self-hosted, linux, bazel-x64]
    timeout-minutes: 30
    outputs:
      build_version: ${{ steps.installer.outputs.build_version }}
    steps:
      - &restore_workspace_access
        name: Restore workspace access before checkout
        if: runner.environment == 'self-hosted'
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY##*/}"
          pipeline_workspace="${RUNNER_WORKSPACE%/}"
          expected="$pipeline_workspace/$repository"
          if [[ "$GITHUB_WORKSPACE" != "$expected" ]]; then
            printf 'Refusing permission repair: expected workspace %s, got %s.\n' \
              "$expected" "$GITHUB_WORKSPACE" >&2
            exit 1
          fi
          if [[ ! -e "$expected" && ! -L "$expected" ]]; then
            echo 'No existing workspace to repair.'
            exit 0
          fi
          work_root="$(realpath -e -- "$pipeline_workspace/..")"
          physical_workspace="$work_root/$repository/$repository"
          if [[ ! -d "$expected" || "$(realpath -e -- "$expected")" != "$physical_workspace" ]]; then
            echo 'Refusing permission repair on a redirected workspace.' >&2
            exit 1
          fi
          expected="$physical_workspace"
          owner="$(id -u):$(id -g)"
          sudo -n find -P "$expected" -xdev -type d \
            -exec chown --no-dereference -- "$owner" {} +
          sudo -n find -P "$expected" -xdev -type d \
            -exec chmod u+rwx -- {} +
          sudo -n find -P "$expected" -xdev -type f -links 1 \
            -exec chown --no-dereference -- "$owner" {} +
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.vs_container.outputs.installer_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/vs-installer
      - name: Prepare installer inspection tools
        run: |
          if ! command -v unsquashfs >/dev/null || ! python3 -c 'import yaml'; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends squashfs-tools python3-yaml
          fi
      - name: Check installer version, checksums and image selection
        id: installer
        shell: bash
        working-directory: ${{ runner.temp }}/vs-installer
        env:
          DEBUG_LAYER: ${{ needs.vs_container.outputs.debug_layer }}
        run: |
          set -euo pipefail
          sha256sum --check artifacts/vs/outputs.sha256
          python3 -B "$GITHUB_WORKSPACE/scripts/validate_sonic_version.py" target/sonic-vs.bin \
            --installer --expect-boot-bundle --secure-upgrade-mode no_sign \
            --expected-commit-id "$GITHUB_SHA" \
            --json-output artifacts/vs/sonic-version.json
          PYTHONPATH="$GITHUB_WORKSPACE" python3 -B -m tools.bazel.ci.verify_vs_selection \
            --workspace "$PWD" --revision "$GITHUB_SHA" --debug-layer "$DEBUG_LAYER" \
            --github-output "$GITHUB_OUTPUT"

  validate_container:
    name: Validate ${{ matrix.image }} (AMD64)
    needs: [vs_container, installer_validation]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.vs_container.outputs.containers) }}
    runs-on: [self-hosted, linux, bazel-x64]
    timeout-minutes: 60
    steps:
      - *restore_workspace_access
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore populated submodules to the installer revision
        run: bash tools/bazel/ci/prepare_image_submodules.sh --populated-only
      - name: Check out the P4RT runtime test at the installer revision
        if: matrix.image == 'docker-sonic-p4rt'
        run: git submodule update --init --depth 1 -- src/sonic-p4rt/sonic-pins
      - name: Check out the Sysmgr gNOI probe at the installer revision
        if: matrix.image == 'docker-sysmgr'
        run: git submodule update --init --depth 1 -- src/sonic-sysmgr/gnoi
      - name: Allocate a fresh container artifact directory
        id: bundle
        run: |
          directory=$(mktemp -d "$RUNNER_TEMP/vs-container.XXXXXXXX")
          printf 'directory=%s\n' "$directory" >> "$GITHUB_OUTPUT"
      - name: Download the selected VS container
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.vs_container.outputs.artifact_prefix }}-${{ matrix.image }}
          path: ${{ steps.bundle.outputs.directory }}
      - name: Check the runner and installed service
        shell: bash
        env:
          BUNDLE_DIR: ${{ steps.bundle.outputs.directory }}
          IMAGE: ${{ matrix.image }}
          BUILD_VERSION: ${{ needs.installer_validation.outputs.build_version }}
          DEBUG_LAYER: ${{ needs.vs_container.outputs.debug_layer }}
        run: |
          set -euo pipefail
          docker info >/dev/null
          python3 -B tools/bazel/ci/vs_container_probe.py \
            --artifacts "$BUNDLE_DIR" --image "$IMAGE" \
            --revision "$GITHUB_SHA" --debug-layer "$DEBUG_LAYER" --build-version "$BUILD_VERSION"

      - name: Retain the container validation result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-${{ matrix.image }}-${{ github.run_attempt }}
          path: |
            ${{ steps.bundle.outputs.directory }}/vs-validation.json
            ${{ steps.bundle.outputs.directory }}/*.runtime.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove this job's downloaded container archive
        if: always() && steps.bundle.outcome == 'success'
        env:
          BUNDLE_DIR: ${{ steps.bundle.outputs.directory }}
        run: rm -rf -- "$BUNDLE_DIR"

  validate_component:
    name: Validate component ${{ matrix.component }} (AMD64)
    needs: vs_container
    if: needs.vs_container.outputs.component_matrix != '{"include":[]}'
    runs-on: [self-hosted, linux, bazel-x64]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.vs_container.outputs.component_matrix) }}
    container:
      image: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
      options: --init
    steps:
      - name: Install native inspection tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 binutils gdb gcc libc6-dev pkg-config
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Allocate a fresh component directory
        id: bundle
        shell: bash
        run: echo "path=$(mktemp -d)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ matrix.artifact_id }}
          merge-multiple: true
          path: ${{ steps.bundle.outputs.path }}
      - name: Validate the original VS component files
        env:
          COMPONENT: ${{ matrix.component }}
          DEBUG: ${{ matrix.debug }}
          BUNDLE: ${{ steps.bundle.outputs.path }}
        run: |
          python3 -B -m tools.bazel.ci.vs_component_artifacts test --component "$COMPONENT" \
            --revision "$GITHUB_SHA" --debug "$DEBUG" --directory "$BUNDLE"

  archive_acceptance:
    name: Container archive (AMD64)
    needs: [archive, package_amd64, kernel_packages_amd64, frr_python_amd64, vs_container, installer_validation, validate_container, validate_component, native_sysmgr_amd64, yang_models]
    if: always() && !cancelled() && needs.vs_container.result != 'skipped'
    runs-on: [self-hosted, linux, bazel-x64]
    steps:
      - name: Require the installer and every selected container
        env:
          INSTALLER: ${{ needs.installer_validation.result }}
          ARM64_PACKAGES: ${{ needs.archive.result }}
          AMD64_PACKAGES: ${{ needs.package_amd64.result }}
          KERNEL: ${{ needs.kernel_packages_amd64.result }}
          FRR_PYTHON: ${{ needs.frr_python_amd64.result }}
          PRODUCER: ${{ needs.vs_container.result }}
          VALIDATION: ${{ needs.validate_container.result }}
          YANG: ${{ needs.yang_models.result }}
          SYSMGR: ${{ needs.native_sysmgr_amd64.result }}
          EXPECT_SYSMGR: ${{ needs.vs_container.outputs.sysmgr_artifact_id != '' }}
          EXPECT_COMPONENTS: ${{ needs.vs_container.outputs.component_matrix != '{"include":[]}' }}
          COMPONENTS: ${{ needs.validate_component.result }}
        shell: bash
        run: |
          set -euo pipefail
          expected_result() { if [[ "$1" == true ]]; then echo success; else echo skipped; fi; }
          test "$SYSMGR" = "$(expected_result "$EXPECT_SYSMGR")"
          test "$COMPONENTS" = "$(expected_result "$EXPECT_COMPONENTS")"
          test "$YANG" = success
          test "$ARM64_PACKAGES" = success && test "$AMD64_PACKAGES" = success &&
          test "$KERNEL" = success && test "$FRR_PYTHON" = success &&
          test "$PRODUCER" = success && test "$INSTALLER" = success && test "$VALIDATION" = success
