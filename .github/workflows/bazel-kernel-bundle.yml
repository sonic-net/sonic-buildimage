name: Bazel kernel DEBs

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
    inputs:
      vs_artifact_id:
        description: Same-run artifact containing the AMD64 kernel DEBs consumed by Make
        type: string
        required: true
  workflow_dispatch:
    inputs:
      verify_cold_cache:
        description: Force an uncached kernel build and verify reuse with a disposable local cache
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bazel-kernel-bundle-${{ inputs.vs_artifact_id && 'vs' || 'standalone' }}-${{ github.run_attempt == '1' && github.event.pull_request.number || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  kernel-bundle:
    name: Registry kernel outputs and Make handoff (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.vs_artifact_id && '["amd64"]' || github.event_name == 'workflow_dispatch' && '["amd64","arm64"]' || '["arm64"]') }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, "${{ matrix.arch == 'amd64' && 'bazel-x64' || 'bazel-arm64' }}"]
    timeout-minutes: 300
    env:
      KERNEL_RUN_TEMP: /mnt/build/k
      KERNEL_REMOTE_CACHE: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_cold_cache && 'http://127.0.0.1:8080' || 'grpc://172.16.0.4:9092' }}
      UPLOAD_KERNEL_CACHE: ${{ (github.event_name == 'workflow_dispatch' && inputs.verify_cold_cache) || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    steps:
      - name: Restore workspace access before checkout
        working-directory: ${{ runner.temp }}
        shell: bash
        env:
          RUNNER_PIPELINE_WORKSPACE: ${{ runner.workspace }}
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY##*/}"
          pipeline_workspace="${RUNNER_PIPELINE_WORKSPACE%/}"
          expected="$pipeline_workspace/$repository"
          if [[ "$GITHUB_WORKSPACE" != "$expected" ]]; then
            printf 'Refusing permission repair: expected workspace %s, got %s.\n' \
              "$expected" "$GITHUB_WORKSPACE" >&2
            exit 1
          fi
          if [[ ! -e "$expected" && ! -L "$expected" ]]; then
            echo 'No existing workspace to repair.'
            exit 0
          fi
          work_root="$(realpath -e -- "$pipeline_workspace/..")"
          physical_workspace="$work_root/$repository/$repository"
          if [[ ! -d "$expected" || "$(realpath -e -- "$expected")" != "$physical_workspace" ]]; then
            echo 'Refusing permission repair on a redirected workspace.' >&2
            exit 1
          fi
          expected="$physical_workspace"
          owner="$(id -u):$(id -g)"
          sudo -n find -P "$expected" -xdev -type d \
            -exec chown --no-dereference -- "$owner" {} +
          sudo -n find -P "$expected" -xdev -type d \
            -exec chmod u+rwx -- {} +
          sudo -n find -P "$expected" -xdev -type f -links 1 \
            -exec chown --no-dereference -- "$owner" {} +
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.vs_artifact_id && github.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Initialize the pinned kernel source
        run: git submodule update --init -- src/sonic-linux-kernel src/sonic-frr src/sonic-supervisord-utilities-rs
      - name: Check the producer and artifact contracts
        run: |
          python3 -B tools/bazel/tests/kernel_test.py
          python3 -B tools/bazel/tests/kernel_make_mapping_test.py
          python3 -B -m unittest discover -s tools/bazel/tests -p 'kernel_cache_*_test.py'
          python3 -B tools/bazel/tests/kernel_sbom_test.py
          python3 -B tools/bazel/tests/public_artifacts_test.py
          python3 -B tools/bazel/tests/kernel_artifacts_test.py
      - name: Provision short kernel scratch root
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(id -u)" -eq 0 || "$KERNEL_RUN_TEMP" != /mnt/build/k ]]; then
            echo 'Refusing privileged provisioning for an unexpected user or scratch path.' >&2
            exit 1
          fi
          for parent in /mnt /mnt/build; do
            if [[ ! -d "$parent" || -L "$parent" || "$(realpath -e -- "$parent")" != "$parent" ]]; then
              echo "Refusing redirected scratch parent: $parent" >&2
              exit 1
            fi
            mode="$(stat -c %a -- "$parent")"
            if [[ "$(stat -c %u -- "$parent")" != 0 ]] || (( (8#$mode & 0022) != 0 )); then
              echo "Scratch parent must be root-owned and not group/world-writable: $parent" >&2
              exit 1
            fi
          done
          if [[ "$(stat -c %d -- /mnt/build)" != "$(stat -c %d -- "$RUNNER_TEMP")" ]]; then
            echo 'Kernel scratch must be on the same filesystem as RUNNER_TEMP.' >&2
            exit 1
          fi
          if [[ -L /mnt/build/k || ( -e /mnt/build/k && ! -d /mnt/build/k ) ]]; then
            echo 'Refusing redirected or non-directory kernel scratch root.' >&2
            exit 1
          fi
          if [[ ! -e /mnt/build/k ]]; then
            sudo -n mkdir --mode=0700 -- /mnt/build/k
            sudo -n chown --no-dereference -- "$(id -u):$(id -g)" /mnt/build/k
            echo 'Created private kernel scratch root for this agent.'
          else
            echo 'Existing kernel scratch root left unchanged for ownership and identity validation.'
          fi
      - name: Prepare short kernel scratch root
        run: python3 -B tools/bazel/ci/kernel_scratch.py prepare --architecture "${{ matrix.arch }}"
      - name: Remove stale fixed kernel state
        id: kernel_state
        run: python3 -B tools/bazel/ci/kernel_scratch.py cleanup
      - name: Check available scratch space
        if: inputs.vs_artifact_id == ''
        run: |
          python3 - <<'PY'
          import os, shutil
          for path in (os.environ['KERNEL_RUN_TEMP'], os.path.expanduser('~')):
              print(f"Kernel storage: {path}: device={os.stat(path).st_dev}, usage={shutil.disk_usage(path)}")
          if shutil.disk_usage(os.environ['KERNEL_RUN_TEMP']).free < 45 * 2**30:
              raise SystemExit('Kernel source validation requires 45 GiB free scratch space')
          PY
      - name: Set up pinned Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          output-base: ${{ env.KERNEL_RUN_TEMP }}/kernel-bundle-state/build/output
      - name: Start a disposable cache for optional cold-build verification
        if: github.event_name == 'workflow_dispatch' && inputs.verify_cold_cache
        env:
          CACHE_SHA256: ${{ matrix.arch == 'amd64' && '6a6b64666c2238ec6b49b7b29f5e41e4149de09417a0028897c9bffe40376876' || '295e54fd58841211b00fb204cafc13affc6a13d8946a4520c0ecdce22626ef93' }}
        run: |
          umask 077
          mkdir -p "$KERNEL_RUN_TEMP/kernel-cache"
          curl --fail --location --retry 3 \
            "https://github.com/buchgr/bazel-remote/releases/download/v2.6.4/bazel-remote-2.6.4-linux-${{ matrix.arch }}" \
            --output "$KERNEL_RUN_TEMP/kernel-cache/bazel-remote"
          printf '%s  %s\n' "$CACHE_SHA256" "$KERNEL_RUN_TEMP/kernel-cache/bazel-remote" | sha256sum -c -
          chmod 700 "$KERNEL_RUN_TEMP/kernel-cache/bazel-remote"
          env -i RUNNER_TRACKING_ID="${RUNNER_TRACKING_ID:-}" \
            "$KERNEL_RUN_TEMP/kernel-cache/bazel-remote" --dir="$KERNEL_RUN_TEMP/kernel-cache/objects" \
            --max_size=8 --http_address=127.0.0.1:8080 --grpc_address=none \
            > "$KERNEL_RUN_TEMP/kernel-cache/server.log" 2>&1 &
          echo "$!" > "$KERNEL_RUN_TEMP/kernel-cache/server.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/status > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/status > /dev/null
      - name: Download kernel DEBs consumed by the VS installer
        if: inputs.vs_artifact_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.vs_artifact_id }}
          merge-multiple: true
          path: target/debs/trixie
      - name: Verify the downloaded package set before exercising Make reuse
        id: vs_handoff
        if: inputs.vs_artifact_id != ''
        run: |
          receipt=$(sha256sum target/debs/trixie/vs-kernel-handoff.json)
          python3 -B tools/bazel/ci/kernel_artifacts.py --from-vs-handoff --architecture "${{ matrix.arch }}" \
            --output "$KERNEL_RUN_TEMP/kernel-bundle-artifacts"
          echo "receipt_sha256=${receipt%% *}" >> "$GITHUB_OUTPUT"
      - name: Build registry kernel outputs in the root module graph
        if: inputs.vs_artifact_id == ''
        shell: bash
        run: |
          set -euo pipefail
          platform="@sonic_build_infra//platforms:${{ matrix.arch == 'amd64' && 'x86_64' || 'aarch64' }}_trixie"
          bazel build --platforms="$platform" --host_platform="$platform" \
            --remote_cache="$KERNEL_REMOTE_CACHE" --remote_upload_local_results="$UPLOAD_KERNEL_CACHE" \
            --execution_log_json_file="$KERNEL_RUN_TEMP/kernel-runtime-actions.json" \
            @sonic_linux_kernel//:linux-image.runtime \
            @sonic_linux_kernel//:linux-image.runtime_metadata \
            @sonic_linux_kernel//:linux-image.control \
            @sonic_linux_kernel//:boot @sonic_linux_kernel//:kernel_metadata.json
          python3 - "$KERNEL_RUN_TEMP/kernel-runtime-actions.json" <<'PY_RUNTIME'
          import json, sys
          decoder = json.JSONDecoder()
          content = open(sys.argv[1]).read()
          while content.strip():
              action, end = decoder.raw_decode(content.lstrip())
              content = content.lstrip()[end:]
              owner = action.get('targetLabel', '').split('//', 1)[0].lstrip('@').split('+', 1)[0]
              if owner != 'sonic-linux-kernel': continue
              assert not any(path.endswith(('.deb', '.debs')) for path in action.get('listedOutputs', [])), action
          PY_RUNTIME
          cache_args=(--remote-cache "$KERNEL_REMOTE_CACHE")
          if [[ "$UPLOAD_KERNEL_CACHE" == true ]]; then cache_args+=(--upload-local-results); fi
          python3 -B tools/bazel/kernel/packages.py build --architecture "${{ matrix.arch }}" "${cache_args[@]}"
      - name: Reject an unsupported kernel configuration without replacing the DEBs
        shell: bash
        run: |
          set -euo pipefail
          sha256sum target/debs/trixie/*.deb > "$KERNEL_RUN_TEMP/kernel-before-rejection.sha256"
          if python3 -B tools/bazel/kernel/packages.py build --architecture "${{ matrix.arch }}" \
            --kernel-config SECURE_UPGRADE_MODE=unsupported --remote-cache "$KERNEL_REMOTE_CACHE" \
            > "$KERNEL_RUN_TEMP/kernel-unsupported.log" 2>&1; then
            echo 'An unsupported kernel setting was silently accepted.'
            exit 1
          fi
          grep -F 'Unsupported kernel configuration' "$KERNEL_RUN_TEMP/kernel-unsupported.log"
          sha256sum --check "$KERNEL_RUN_TEMP/kernel-before-rejection.sha256"
      - name: Verify registry package publication and repeated Make consumption
        env:
          SONIC_BAZEL_KERNEL_VS_HANDOFF_SHA256: ${{ steps.vs_handoff.outputs.receipt_sha256 }}
        run: |
          python3 -B tools/bazel/kernel/packages.py verify --architecture "${{ matrix.arch }}"
          python3 -B tools/bazel/ci/kernel_make_smoke.py --architecture "${{ matrix.arch }}"
      - name: Verify a fresh output base reuses the registered kernel action
        if: github.event_name == 'workflow_dispatch' && inputs.verify_cold_cache
        shell: bash
        run: |
          set -euo pipefail
          platform="@sonic_build_infra//platforms:${{ matrix.arch == 'amd64' && 'x86_64' || 'aarch64' }}_trixie"
          bazel --output_base="$KERNEL_RUN_TEMP/kernel-cache-hit" build \
            --platforms="$platform" --host_platform="$platform" \
            --remote_cache="$KERNEL_REMOTE_CACHE" --remote_upload_local_results=false \
            --execution_log_json_file="$KERNEL_RUN_TEMP/kernel-cache-hit.json" \
            @sonic_linux_kernel//:kernel_packages
          python3 - "$KERNEL_RUN_TEMP/kernel-cache-hit.json" <<'PY_VERIFY'
          import json, sys
          decoder = json.JSONDecoder()
          content = open(sys.argv[1]).read()
          actions = []
          while content.strip():
              entry, end = decoder.raw_decode(content.lstrip())
              content = content.lstrip()[end:]
              if entry.get('mnemonic') == 'SonicKernelBuild': actions.append(entry)
          assert len(actions) == 1 and actions[0].get('cacheHit') is True and actions[0].get('runner') == 'remote cache hit', actions
          PY_VERIFY
      # Installation exercises APT hooks in a disposable Debian system after the
      # native unprivileged build/cache proof. This container never builds a kernel.
      - name: Validate already-built DEB installation, modules and initramfs
        run: |
          umask 077
          # The artifact-only lane may have no build output symlink in its checkout.
          location="$(bazel query --output=location @sonic_linux_kernel//tools/bazel:verify_debug.py)"
          verification_script="${location%%:*}"
          test -f "$verification_script"
          verification_tools="$(dirname -- "$(realpath -e -- "$verification_script")")"
          docker run --rm --platform "linux/${{ matrix.arch }}" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/sonic,readonly" \
            --mount "type=bind,src=$verification_tools,dst=/kernel-verification,readonly" \
            --workdir /sonic \
            debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c \
            bash tools/bazel/ci/kernel_install_smoke.sh /sonic/target/debs/trixie /kernel-verification
          echo 'Installed kernel DEB, external module and initramfs checks passed.'
      - name: Select verified DEBs and a public validation summary
        if: inputs.vs_artifact_id == ''
        run: |
          umask 077
          python3 -B tools/bazel/ci/kernel_artifacts.py --architecture "${{ matrix.arch }}" \
            --output "$KERNEL_RUN_TEMP/kernel-bundle-artifacts"
      - name: Retain verified DEBs and the validation summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-source-packages-${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ env.KERNEL_RUN_TEMP }}/kernel-bundle-artifacts
      - name: Stop the disposable verification cache
        id: kernel_cache_stop
        if: always() && steps.kernel_state.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.verify_cold_cache
        run: |
          if [[ -f "$KERNEL_RUN_TEMP/kernel-cache/server.pid" ]]; then
            pid="$(cat "$KERNEL_RUN_TEMP/kernel-cache/server.pid")"
            kill "$pid"
            for attempt in $(seq 1 30); do
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$pid" 2>/dev/null; then
              echo 'Verification cache did not stop; retaining its scratch directory.' >&2
              exit 1
            fi
          fi
      - name: Clean fixed kernel scratch state
        if: always() && steps.kernel_state.outcome == 'success' && (steps.kernel_cache_stop.outcome == 'success' || steps.kernel_cache_stop.outcome == 'skipped')
        run: python3 -B tools/bazel/ci/kernel_scratch.py cleanup
