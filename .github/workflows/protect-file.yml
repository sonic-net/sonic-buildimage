name: Protect certain files to avoid further changes

on:
  push:
    branches:
      - 'master'
      - '202[2-9][0-9][0-9]'
  pull_request:
    branches:
      - 'master'
      - '202[2-9][0-9][0-9]'

jobs:
  check-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Check protected files
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          echo "Starting file check step"
          protected_files=('src/sonic-config-engine/minigraph.py' 'files/build_templates/init_cfg.json.j2')
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # Use the base of this run's merge commit, even when rerunning old jobs.
            base_commit=$(git rev-parse HEAD^1)
          elif [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            base_commit=$(git hash-object -t tree /dev/null)
          else
            base_commit="$BEFORE_SHA"
            git fetch --no-tags --depth=1 origin "$base_commit"
          fi
          changed_files=$(git diff --name-only "$base_commit" HEAD)

          for protected_file in "${protected_files[@]}"; do
            echo "Checking ${protected_file}"
            if grep -Fxq "$protected_file" <<< "$changed_files"; then
              echo "Error: You are trying to modify ${protected_file}, which is protected."
              exit 1
            fi
          done
          echo "No changes detected in protected files"
