name: Protect certain files to avoid further changes

on:
  pull_request:
    branches:
      - 'master'
      - '202[2-9][0-9][0-9]'

permissions:
  contents: read

jobs:
  minigraph-freeze:
    if: github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Test minigraph detector
        run: python3 -m unittest discover -s tests -p test_minigraph_freeze.py

      - name: Check minigraph retirement policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          MINIGRAPH_GUIDE_URL: ${{ github.server_url }}/${{ github.event.pull_request.head.repo.full_name }}/blob/${{ github.event.pull_request.head.sha }}/.github/workflows/README.md#minigraph-retirement-gate
        run: python3 scripts/check_minigraph_freeze.py --base "$BASE_SHA" --head "$HEAD_SHA"

  check-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check protected files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          BASE_BRANCH: ${{ github.base_ref }}
          GUIDE_URL: ${{ github.server_url }}/${{ github.event.pull_request.head.repo.full_name }}/blob/${{ github.event.pull_request.head.sha }}/.github/workflows/README.md#protected-configuration-files
        shell: bash
        run: |
          set -euo pipefail
          protected_files=(
              'files/build_templates/init_cfg.json.j2'
          )
          if [[ "${BASE_BRANCH:?Missing pull request base branch}" != "master" ]]; then
              protected_files+=('src/sonic-config-engine/minigraph.py')
          fi
          # Compare the event's base with its test merge, not a moving branch ref.
          changed_files=$(git diff --no-renames --name-only \
              "${BASE_SHA:?Missing pull request base SHA}" \
              "${HEAD_SHA:?Missing pull request merge SHA}" \
              -- "${protected_files[@]}")

          if [[ -n "$changed_files" ]]; then
              while IFS= read -r protected_file; do
                  printf '::error file=%s::This file is covered by the existing image-default or release freeze.\n' "$protected_file"
              done <<< "$changed_files"
              echo "Remove the protected-file change or discuss a necessary compatibility or retirement exception with the maintainers."
              echo "This legacy policy is separate from the master minigraph-retirement gate."
              echo "Guide: ${GUIDE_URL:?Missing contributor guide URL}"
              exit 1
          fi
          echo "No changes detected in protected files"
