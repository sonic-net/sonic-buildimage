name: Protect certain files to avoid further changes

on:
  push:
    branches:
      - 'master'
      - '202[2-9][0-9][0-9]'
  pull_request:
    branches:
      - 'master'
      - '202[2-9][0-9][0-9]'

jobs:
  check-file:
    if: ${{ github.event.deleted != true }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Check protected files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for commit in "$BASE_SHA" "$HEAD_SHA"; do
            if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Error: Missing or invalid event commit."
              exit 1
            fi
          done

          # Checkout contains the tested PR merge or the pushed commit.
          git cat-file -e "${HEAD_SHA}^{commit}"
          if [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            # A new branch has no previous tree; protected files count as additions.
            BASE_SHA=$(git hash-object -w -t tree --stdin < /dev/null)
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git cat-file -e "${BASE_SHA}^{commit}"
          fi

          protected_files=('src/sonic-config-engine/minigraph.py' 'files/build_templates/init_cfg.json.j2')
          changed_files=()
          for file in "${protected_files[@]}"; do
            before=$(git ls-tree "$BASE_SHA" -- "$file")
            after=$(git ls-tree "$HEAD_SHA" -- "$file")
            if [[ "$before" != "$after" ]]; then
              changed_files+=("$file")
            fi
          done
          if (( ${#changed_files[@]} == 0 )); then
            echo "No changes detected in protected files"
            exit 0
          fi

          # The fork syncs master from sonic-net. Keep the original prohibition
          # in sonic-net itself and on release branches. The canonical URL and
          # ref below are independent of PR inputs and checked-out files.
          if [[ "$GITHUB_REPOSITORY" != securely1g/sonic-buildimage || "${GITHUB_BASE_REF:-$GITHUB_REF_NAME}" != master ]]; then
            printf 'Protected file changed: %s\n' "${changed_files[@]}"
            exit 1
          fi
          git fetch --no-tags --depth=1 --filter=blob:none \
            https://github.com/sonic-net/sonic-buildimage.git refs/heads/master
          upstream_sha=$(git rev-parse --verify 'FETCH_HEAD^{commit}')
          for file in "${changed_files[@]}"; do
            canonical=$(git ls-tree "$upstream_sha" -- "$file")
            proposed=$(git ls-tree "$HEAD_SHA" -- "$file")
            if [[ "$canonical" != '100644 blob '* || "$proposed" != "$canonical" ]]; then
              echo "Protected file $file must match the regular file in sonic-net master at $upstream_sha"
              exit 1
            fi
            echo "Verified $file against sonic-net master at $upstream_sha"
          done
