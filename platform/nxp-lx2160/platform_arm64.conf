# SONiC installer platform hooks for the NXP LX2160ARDB (U-Boot).
#
# Keeps two images in the U-Boot environment the way sonic-installer's
# U-Boot backend expects (sonic_version_1/2, sonic_image_1/2, boot_next,
# boot_once, linuxargs). Each SONiC boot first applies the DPAA2 layout (DPL)
# from NOR, like NXP's default bootcmd.
#
# Install paths:
# - ONIE (onie-nos-install): wipes the eMMC, creates one SONiC-OS partition
#   and hooks into ONIE's boot flow through nos_bootcmd; ONIE's own bootcmd
#   (check_boot_reason, nos_bootcmd, onie_bootcmd) stays in place.
# - SONiC (sonic-installer install): installs into /host.
# - Another Linux on the board: an installer script there unpacks the image,
#   sources this file and calls lx2160_uboot_env. Without an ONIE
#   environment (NXP's default one), the boot menu replaces bootcmd and NXP's
#   bootcmd is kept as debian_boot.
#
# The U-Boot environment must be valid. With the ONIE U-Boot environment
# (lx2160ardb_tfa_onie_defconfig) U-Boot saves it on first boot. With NXP's,
# save it once at the U-Boot prompt after a normal start (not after
# "env default -a"); libubootenv refuses to write a blank environment.

VAR_LOG=512
FW_ENV_CONFIG="/dev/mtd0 0x500000 0x10000 0x20000"
FW_ENV_CONFIG_FILE=${FW_ENV_CONFIG_FILE:-/etc/fw_env.config}
LX2160_FIT=/boot/sonic_arm64.fit
LX2160_FIT_ADDR=0xa0000000
LX2160_DPL='sf probe 0:0; sf read 0x80d00000 0xd00000 0x100000; fsl_mc lazyapply dpl 0x80d00000'
# eMMC controller (esdhc1); the SD card slot is 2140000.mmc
LX2160_EMMC_CTRL=2150000.mmc

lx2160_emmc_dev()
{
    for b in /sys/block/mmcblk[0-9]*; do
        case "$(readlink -f $b)" in
        */$LX2160_EMMC_CTRL/*) echo /dev/$(basename $b); return 0 ;;
        esac
    done
    return 1
}

# block device mounted on $1 (ONIE's busybox has no findmnt)
lx2160_mnt_dev()
{
    awk -v m="$1" '$2 == m { print $1 }' /proc/mounts | tail -1
}

# U-Boot "<interface> <dev>:<part>" for the partition holding $1 (a mount point)
lx2160_uboot_part()
{
    blk=$(basename "$(lx2160_mnt_dev "$1")")
    part=$(cat /sys/class/block/$blk/partition)
    case $blk in
    mmcblk*) echo "mmc $(echo $blk | sed 's/^mmcblk\([0-9]*\).*/\1/'):$part" ;;
    *) echo "scsi 0:$part" ;;  # the board's single SATA disk
    esac
}

# fw_setenv -s script line: libubootenv takes "name=value", U-Boot's own
# fw_setenv (in ONIE) "name value"
lx2160_env_line()
{
    if [ "$LX2160_ENV_SEP" = "=" ]; then
        echo "$1=$2"
    else
        echo "$1 $2"
    fi
}

# lx2160_uboot_env <mount point> <image dir> <image version> <default|once>
# Installs the image into slot 1 (the previous slot-1 image moves to slot 2)
# and boots it always (default) or on the next boot only (once).
lx2160_uboot_env()
{
    mnt=$1 img=$2 ver=$3 mode=$4

    [ -f $FW_ENV_CONFIG_FILE ] || echo "$FW_ENV_CONFIG" > $FW_ENV_CONFIG_FILE
    # Unset variables: libubootenv's fw_printenv -n prints nothing and exits 0,
    # U-Boot's (ONIE) exits 255. Test the output, and never let a read fail
    # under the installer's set -e.
    if [ -z "$(fw_printenv -n bootcmd 2>/dev/null)" ]; then
        echo "ERROR: no valid U-Boot environment (save it once: stop autoboot, then saveenv at the U-Boot prompt)"
        return 1
    fi
    LX2160_ENV_SEP=" "
    fw_setenv --help 2>&1 | grep -q "Script Example" && LX2160_ENV_SEP="="
    onie=
    [ -n "$(fw_printenv -n onie_bootcmd 2>/dev/null)" ] && onie=yes

    dev=$(lx2160_mnt_dev "$mnt")
    uuid=$(blkid "$dev" | sed -n 's/.* UUID="\([^"]*\)".*/\1/p')
    set -- $(lx2160_uboot_part "$mnt")
    load="$1 $2"
    scan=""
    [ "$1" = scsi ] && scan="scsi scan; "

    script=$(mktemp)
    # Without ONIE: NXP's bootcmd becomes debian_boot, once
    [ -n "$onie" ] || [ -n "$(fw_printenv -n debian_boot 2>/dev/null)" ] ||
        lx2160_env_line debian_boot "$(fw_printenv -n bootcmd)" >> $script

    # Each slot is sonic_version_N, linuxargs[_2] and one sonic_image_N
    # command; sonic_root holds the shared root arguments.
    old_ver=$(fw_printenv -n sonic_version_1 2>/dev/null || true)
    if [ -n "$old_ver" ] && [ "$old_ver" != "$ver" ] && [ "$old_ver" != NONE ]; then
        old_load=$(fw_printenv -n sonic_boot_load_1 2>/dev/null || true)
        if [ -n "$old_load" ]; then
            # slot 1 still in an earlier layout
            old_image="run lx2160_dpl; setenv bootargs \${sonic_root} \${linuxargs_2}; $old_load; bootm \${fit_addr}"
        else
            old_image=$(fw_printenv -n sonic_image_1 | sed 's/\${linuxargs}/${linuxargs_2}/')
        fi
        lx2160_env_line sonic_version_2 "$old_ver" >> $script
        lx2160_env_line linuxargs_2 "$(fw_printenv -n linuxargs)" >> $script
        lx2160_env_line sonic_image_2 "$old_image" >> $script
    fi
    # variables of an earlier layout
    for v in sonic_bootargs_1 sonic_bootargs_2 sonic_boot_load_1 sonic_boot_load_2; do
        [ -z "$(fw_printenv -n $v 2>/dev/null)" ] || lx2160_env_line $v "" >> $script
    done

    if [ -n "$onie" ]; then
        menu3='echo "3: ONIE (run onie_rescue)"'
        fallback="run onie_rescue"
    else
        menu3='echo "3: run debian_boot"'
        fallback="run debian_boot"
    fi
    select='run print_menu; test -n "$boot_once" && setenv do_boot_once "$boot_once" && setenv boot_once "" && saveenv && run do_boot_once; run boot_next'
    lx2160_env_line lx2160_dpl "$LX2160_DPL" >> $script
    lx2160_env_line fit_addr "$LX2160_FIT_ADDR" >> $script
    lx2160_env_line sonic_root "root=UUID=$uuid rw rootwait panic=1 console=ttyAMA0,115200" >> $script
    lx2160_env_line sonic_version_1 "$ver" >> $script
    lx2160_env_line linuxargs "net.ifnames=0 loopfstype=squashfs loop=$img/fs.squashfs varlog_size=$VAR_LOG ${ONIE_PLATFORM_EXTRA_CMDLINE_LINUX}" >> $script
    lx2160_env_line sonic_image_1 "run lx2160_dpl; setenv bootargs \${sonic_root} \${linuxargs}; ${scan}ext4load $load \${fit_addr} /$img$LX2160_FIT; bootm \${fit_addr}" >> $script
    lx2160_env_line print_menu "echo \"1: \$sonic_version_1 (run sonic_image_1)\"; echo \"2: \$sonic_version_2 (run sonic_image_2)\"; $menu3" >> $script
    if [ -n "$onie" ]; then
        # ONIE's bootcmd runs nos_bootcmd, then ONIE if that returns
        lx2160_env_line nos_bootcmd "$select" >> $script
    else
        lx2160_env_line bootcmd "$select" >> $script
    fi
    if [ "$mode" = default ]; then
        lx2160_env_line boot_next "run sonic_image_1" >> $script
    else
        [ -n "$(fw_printenv -n boot_next 2>/dev/null)" ] ||
            lx2160_env_line boot_next "$fallback" >> $script
        lx2160_env_line boot_once "run sonic_image_1" >> $script
    fi
    # U-Boot's fw_setenv (ONIE) asks for confirmation unless forced
    if [ "$LX2160_ENV_SEP" = "=" ]; then
        fw_setenv -s $script
    else
        fw_setenv -f -s $script
    fi
    rc=$?
    rm -f $script
    return $rc
}

if [ "$install_env" = "onie" ]; then
    # Install onto the eMMC: one GPT partition for SONiC, whole device.
    create_partition()
    {
        blk_dev=$(lx2160_emmc_dev) || {
            echo "ERROR: eMMC ($LX2160_EMMC_CTRL) not found"
            exit 1
        }
        echo "Partitioning $blk_dev (eMMC) for SONiC"
        sgdisk -Z $blk_dev > /dev/null 2>&1 || true
        sgdisk -n 1:: -c 1:"$demo_volume_label" -t 1:8300 $blk_dev || {
            echo "ERROR: unable to create the SONiC partition on $blk_dev"
            exit 1
        }
        partprobe $blk_dev 2>/dev/null || blockdev --rereadpt $blk_dev
        demo_dev=${blk_dev}p1
    }

    mount_partition()
    {
        mkfs.ext4 -F -L "$demo_volume_label" $demo_dev || {
            echo "ERROR: unable to create a file system on $demo_dev"
            exit 1
        }
        demo_mnt=$(mktemp -d)
        mount -t ext4 $demo_dev $demo_mnt || {
            echo "ERROR: unable to mount $demo_dev on $demo_mnt"
            exit 1
        }
    }
fi

bootloader_menu_config()
{
    case "$install_env" in
    onie) lx2160_uboot_env "$demo_mnt" "$image_dir" "$demo_volume_revision_label" default ;;
    # sonic-installer makes the new image the default afterwards if asked
    sonic) lx2160_uboot_env "$demo_mnt" "$image_dir" "$demo_volume_revision_label" once ;;
    esac
}
