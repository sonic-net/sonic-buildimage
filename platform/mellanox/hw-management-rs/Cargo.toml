[package]
# A Rust port of the hw-management write modules, written to be handed back to
# the hw-management package.  Keep the function names and parameter names
# identical to the Python originals so that hand-over is a directory move.
name = "hw-management-rs"
version = "0.1.0"
edition = "2021"
# `Option::is_none_or` (thermal_updater.rs) needs 1.82; the slave image is on 1.86.
rust-version = "1.82"
authors = ["SONiC Team <sonic-dev@lists.sonicfoundation.dev>"]
description = "Rust port of the hw-management thermal write modules"
license = "Apache-2.0"

[dependencies]
log = "0.4"

[dev-dependencies]
tempfile = "3"
