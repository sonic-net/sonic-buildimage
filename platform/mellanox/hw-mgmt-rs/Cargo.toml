[package]
name = "hw-mgmt"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "hw-management's Python helpers the NVIDIA platform API imports, in Rust"

# Built as ../platform-api-rs-crates/hw-mgmt, as platform-native is, so its
# path dependencies name the same siblings and resolve to one platform-base.
#   cargo test --manifest-path ../platform-api-rs-crates/hw-mgmt/Cargo.toml
[dependencies]
platform-base = { path = "../platform-base" }

[features]
# The test root, for platform-native's tests of what calls into this crate.
testing = ["platform-base/testing"]

[dev-dependencies]
platform-base = { path = "../platform-base", features = ["testing"] }
