[package]
# The name sonic-platform-common's provider takes its native implementation
# by; see ../platform-api-rs-crates/README.md for how this crate takes the
# stub's place.
name = "platform-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "The NVIDIA (Mellanox) platform API, natively in Rust"

# This crate is always built as ../platform-api-rs-crates/platform-native --
# by the daemons' build, whose provider finds it there, and by its own tests --
# so its path dependencies name its siblings in that directory.  Cargo resolves
# a relative path from wherever it found the manifest, and
# platform-native.cargo.toml patches the daemons' git dependencies to the same
# siblings, so this crate and the provider resolve one platform-api.  Test it
# from there:
#   cargo test --manifest-path ../platform-api-rs-crates/platform-native/Cargo.toml
[dependencies]
# hw-management's Python helpers that sonic_platform imports.
hw-mgmt = { path = "../hw-mgmt" }
libc = "0.2"
platform-api = { path = "../platform-api" }
platform-base = { path = "../platform-base" }
# Python's `re`, for the handful of patterns the vendor code matches with it.
regex = "1"

# The scripted cURL its BMC tests talk to.
[dev-dependencies]
hw-mgmt = { path = "../hw-mgmt", features = ["testing"] }
platform-base = { path = "../platform-base", features = ["testing"] }
