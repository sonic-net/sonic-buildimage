# cargo --config file that links this platform's native API into a Rust
# consumer of the platform API -- today the Rust pmon daemons, for which
# mlnx-platform-api-rs.mk sets it in place of
# rules/sonic-pmon-daemons-rs.cargo.toml.
#
# The same patches as that file, with one difference: platform-provider is
# taken from ../platform-api-rs-crates, where its `../platform-native` is this
# platform's native API rather than the stub that refuses to open.  Everything
# the provider reaches by path has to come from the same directory, or cargo
# sees two platform-api packages and the build fails on mismatched types; see
# ../platform-api-rs-crates/README.md.
#
# Cargo resolves a path in a --config file from two directories above the
# file, which for this one is platform/mellanox.
[patch."https://github.com/sonic-net/sonic-platform-common.git"]
platform-api      = { path = "platform-api-rs-crates/platform-api" }
platform-provider = { path = "platform-api-rs-crates/platform-provider" }

# Not through ../platform-api-rs-crates: swss-common inherits its version
# from its own workspace, and cargo looks for that workspace above wherever it
# found the manifest -- above a link, there is none.
[patch."https://github.com/sonic-net/sonic-swss-common.git"]
swss-common = { path = "../../src/sonic-swss-common/crates/swss-common" }
