# Grandtrans arm64 bootware bootloader (u-boot-like) platform config.
#
# bootware boots via the u-boot script install_onie.scr on the boot partition
# (/dev/sda1). It selects the image to boot through the loop= parameter in the
# bootargs, e.g. loop=image-<version>/fs.squashfs.
#
# Only arm64 grandtrans uses bootware. amd64 builds use grub and must NOT get
# this override, so it lives in the arch-specific platform_arm64.conf; the
# generic platform.conf stays empty (grub default).
#
# The default bootloader_menu_config() in default_platform.conf is grub-specific,
# so override it here to update the bootware loop= parameter instead.

bootloader_menu_config() {
    local boot_mnt="/mnt"
    local boot_dev="/dev/sda1"

    # Ensure the boot partition is mounted before updating its boot script.
    if ! mountpoint -q "$boot_mnt"; then
        mount "$boot_dev" "$boot_mnt" || {
            echo "ERROR: failed to mount boot partition $boot_dev on $boot_mnt"
            exit 1
        }
        local _mounted=1
    fi

    # Point the bootware loop= at the newly installed image rootfs.
    sed -i "s|loop=image-[^/]*|loop=$image_dir|" "$boot_mnt/install_onie.scr" || {
        echo "ERROR: failed to update $boot_mnt/install_onie.scr"
        [ -n "$_mounted" ] && umount "$boot_mnt"
        exit 1
    }

    [ -n "$_mounted" ] && umount "$boot_mnt"
    echo "bootware: boot loop set to $image_dir"
}

