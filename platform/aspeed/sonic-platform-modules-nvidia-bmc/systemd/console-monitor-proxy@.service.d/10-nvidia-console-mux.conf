# NVIDIA AST2700 BMC: the switch CPU console shares the BMC's own console UART
# (ttyS12) behind a CPLD mux. Attaching the console-monitor proxy therefore has
# to flip the mux and take the tty away from the BMC's serial login.
#
# The helper stops the getty imperatively on attach and restarts it on detach,
# for line 0 only, rather than declaratively with Conflicts=. Conflicts= plus
# the restart on detach deadlocks on `systemctl restart`: the stop half enqueues
# a getty start, the queued proxy start enqueues a getty stop, and systemd
# resolves the contradiction by cancelling the proxy's start job -- leaving the
# proxy inactive and the console silently dead. Restart is the normal way to
# apply a CONSOLE_PORT change, so it has to work. Trade-off: nothing
# declaratively prevents someone starting the getty by hand underneath a running
# proxy; it would then compete for the tty.
#
# Caveat: ttyS12 is also the BMC kernel console (console=ttyS12 in the
# bootargs), so BMC kernel messages interleave into the recorded/forwarded
# stream. That is inherent to the shared-UART design on this board.
#
# hw-management moves uart_sel on every host power transition and never puts it
# back to 3, and the proxy cannot detect the loss. Pull in the reconciler's
# watch, which re-asserts the mux on every write to it for as long as this proxy
# runs. BindsTo= in that unit ties its lifetime to ours; no enablement is
# involved, so a lazy-installer deb whose postinst never ran still gets it.
[Unit]
Wants=nvidia-bmc-console-mux-reconcile@%i.path

[Service]
ExecStartPre=/usr/bin/nvidia-bmc-console-mux.sh attach %i
ExecStopPost=-/usr/bin/nvidia-bmc-console-mux.sh detach %i
