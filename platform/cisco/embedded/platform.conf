#
# Handle ACPI configuration file, if so configured
#

_set=$(set +o; set -$-)

# shopt and pipefail not supported in onie installer shell
#shopt -s nullglob
#set -o errexit -o pipefail
set -o errexit

ACPI_CPIO=.cpio
RUNNING_ON_SIM=false
if grep -q '^model name.: VXR$' /proc/cpuinfo; then
    echo "Running ${onie_platform} [$platform] on simulator" 2>&1
    ACPI_CPIO=.sim.cpio
    RUNNING_ON_SIM=true
fi

case "${onie_platform}" in
    x86_64-8102_64h_o-r0)
        ACPI_CPIO=8102_64H_O${ACPI_CPIO}
    ;;
    x86_64-8101_32fh_o-r0)
        ACPI_CPIO=8201_32FH_O${ACPI_CPIO}
    ;;
    x86_64-8101_32fh_o_c01-r0)
        ACPI_CPIO=8101_32FH_O_C01${ACPI_CPIO}
    ;;
    *)
        echo "Unsupported Cisco embedded platform: ${onie_platform}" >&2
        exit 1
        ;;
esac

_root=$demo_mnt/$image_dir
INITRD=$(echo $_root/boot/initrd.img*amd64)

if [ "$SONIC_IMMUTABLE_FS" = "y" ] || [ "$NO_SHIM" = "y" ]; then
    echo "No InitRD acpi changes needed for this image"
elif [ -f ${INITRD} ]; then
    if [ -f $_root/platform/acpi/${ACPI_CPIO} ]; then
        cat $_root/platform/acpi/${ACPI_CPIO} ${INITRD} > ${INITRD}.acpi
        chown root:root ${INITRD}.acpi || true
        chmod u-rw,go=r ${INITRD}.acpi
        ln -f ${INITRD} ${INITRD}.build
        ln -f ${INITRD}.acpi ${INITRD}
        echo "Set up InitRD with ${ACPI_CPIO}"
    else
        echo No ${ACPI_CPIO} for ${onie_platform} "[$platform]"  2>&1
    fi
fi
eval $_set
