set_cisco_8000_sdk_env()
{
    if ! grep -q '^model name.: VXR$' /proc/cpuinfo; then
        # Find asic dev in UIO list
        # $1 is empty for single npu system
        retries=90
        # Get the uio device name dynamically
        ASIC_CONF_FILE="/usr/share/sonic/platform/asic_dev_id.conf"
        if [ -f $ASIC_CONF_FILE ]; then
            if [ -z $NAMESPACE_ID ]; then
                # For single NPU, DEV is not defined
                dev_id=DEV_ID_ASIC_0
            else
                # Multi NPU
                dev_id=DEV_ID_ASIC_$NAMESPACE_ID
            fi
            pci_dev_id=$(awk -F= -v key="$dev_id" '$1 == key {print $2; exit}' "$ASIC_CONF_FILE")
        fi
        # if pci_dev_id is not set, set it to NPU0 for Fixed systems
        if [ -z "$pci_dev_id" ]; then
            pci_dev_id="NPU0"
        fi

        i=0
        uio_ready=
        while [ $i -lt $retries ]; do
            uio=
            uio_sysfs=
            for uio_name in /sys/class/uio/uio*/name; do
                [ -r "$uio_name" ] || continue
                if grep -Fq -- "$pci_dev_id" "$uio_name"; then
                    uio_sysfs=${uio_name%/name}
                    break
                fi
            done

            if [ -n "$uio_sysfs" ]; then
                uio=/dev/${uio_sysfs##*/}
                uio_dev=$(cat "$uio_sysfs/dev" 2>/dev/null)
                if [ -n "$uio_dev" ]; then
                    uio_major=${uio_dev%:*}
                    uio_minor=${uio_dev#*:}
                    current_dev=$(stat -c '%t:%T' "$uio" 2>/dev/null || true)
                    expected_dev=$(printf '%x:%x' "$uio_major" "$uio_minor")
                    if [ ! -c "$uio" ] || [ "$current_dev" != "$expected_dev" ]; then
                        rm -f "$uio"
                        mknod -m 660 "$uio" c "$uio_major" "$uio_minor" || {
                            echo "Failed to create $uio for NPU(asic$DEV:$pci_dev_id)"
                            return 1
                        }
                    fi

                    current_dev=$(stat -c '%t:%T' "$uio" 2>/dev/null || true)
                    current_uio_dev=$(cat "$uio_sysfs/dev" 2>/dev/null)
                    if [ "$current_uio_dev" = "$uio_dev" ] && \
                        grep -Fq -- "$pci_dev_id" "$uio_sysfs/name" && \
                        [ "$current_dev" = "$expected_dev" ]; then
                        uio_ready=1
                        echo "Found $uio device for NPU(asic$DEV:$pci_dev_id)"
                        break
                    fi
                    rm -f "$uio"
                    uio=
                fi
            fi

            sleep 1
            i=$((i + 1))
            echo "NPU(asic$DEV:$pci_dev_id) not ready/found .. waiting ..$i"
        done

        if [ "$uio_ready" != "1" ]; then
            echo "Timed out waiting for UIO device for NPU(asic$DEV:$pci_dev_id)"
            return 1
        fi
    fi

    if grep -q '^model name.: VXR$' /proc/cpuinfo; then
        echo "Running ${onie_platform} [$platform] on simulator" 2>&1
        mkdir /mnt/pacific
        mount -o ro -t iso9660 /dev/sr1 /mnt/pacific
        if [ -z $NAMESPACE_ID ]; then
            # Single NPU
            line_num=1
        else
            # Multi NPU
            line_num=$(($NAMESPACE_ID + 1))
        fi
        str=`sed -n ${line_num}p /mnt/pacific/pacific_ports.txt`
        str=${str/_/}
        str=${str/ /'/socket/'}
        export SDK_DEVICE_NAME=$str
    else
        export SDK_DEVICE_NAME=$uio
    fi

    # Cisco SDK debug shell support
    version=$(python3 -V 2>&1 | sed 's/.* \([0-9]\).\([0-9]\).*/\1\.\2/')
    if [ ! -z "$version" ]; then
        export PYTHONPATH=/usr/lib/cisco/pylib
        export DEBUG_SHELL_ENABLE=1
        export DEBUG_SHELL_PYTHON_SO_PATH=$(/usr/bin/python3 -c "import sysconfig; print('/'.join(sysconfig.get_config_vars('LIBPL', 'LDLIBRARY')))")
        export DEBUG_SHELL_PYTHON_PATH=/usr/lib/cisco/pylib
        export S1DS_STDERR_REDIRECT=1
        export DEBUG_SHELL_PYTHON_INTERPRETER_REUSE=1
    fi
}

set_cisco_8000_sdk_env
