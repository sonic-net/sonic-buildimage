[Service]
# bmc0's static IP comes from /etc/network/interfaces, which interfaces-config.sh
# renders from interfaces.j2 at boot. The udev rule in 70-usb-network.rules pulls
# in ifup@bmc0.service as soon as bmc0 enumerates, which on the first boot after
# imaging is before interfaces-config has rendered the bmc0 stanza, so the
# template's "ifup --allow=hotplug bmc0" fails with "cannot find interfaces: bmc0".
#
# Ordering this instance After=interfaces-config.service does not work: the
# ifup@.service template is Before=network-online.target, and docker -> database
# -> config-setup -> interfaces-config are transitively After= it, so that is an
# ordering cycle and systemd deletes config-setup/database/sonic.target start
# jobs to break it. Inherited Before= cannot be reset from a drop-in.
#
# Instead skip the ifup while the stanza is missing. interfaces-config.sh
# restarts networking.service right after rendering it, and that "ifup -a"
# configures bmc0 (this is what already brings bmc0 up on first boot today).
# Later re-enumerations (BMC gadget restart) find the stanza and run the normal
# ifup, so the runtime path is unchanged.
ExecStart=
ExecStart=/bin/sh -c '/sbin/ifquery --list --allow=hotplug | grep -qx bmc0 || { logger -t ifup@bmc0 "bmc0 not yet in /etc/network/interfaces; skipping, interfaces-config will configure it"; exit 0; }; exec /sbin/ifup --allow=hotplug bmc0'
