# Ciena CN8140 (Rudra40) platform kernel modules
# Loaded at boot by systemd-modules-load.service
#
# Only modules that lack udev autoload (no MODULE_DEVICE_TABLE) or that must
# be pre-loaded to ensure correct probe order are listed here.

# IPMI subsystem
ipmi_si
ipmi_devintf

# Intel PCH SPI-NOR controller — exposes the BIOS flash as an MTD partition.
# Listed before the rudra40 FPGA SPI section so the BIOS partition enumerates
# first (BIOS=mtd0, rudra40-gold=mtd1, rudra40-user=mtd2), matching the udev
# cold-plug ordering seen on normal boots. This is a PCI driver that otherwise
# only udev-autoloads; the platform postinst also modprobes it explicitly so it
# is present on first-time first boot (before depmod-driven autoload works).
spi-intel-pci

# Sub-device drivers — must be registered BEFORE bmc8140_uio probes, because
# sirilx_platform.h uses synchronous device_attach() to bind them inline.
# The softdep in modprobe.d also handles this for udev-triggered loads.
ciena_raw_chardev
bmc8140_cic
bmc8140-gpio
ciena_fan
ciena_thermal
led-sysfs

# Sub-device drivers for rudra40 (sirilx_uio) — spi_ciena_fpga must be
# registered before rudra40 creates spi-ciena-fpga platform devices so
# the SPI master probe runs inline during platform_device_add().
rudra40_cic
sirilx_gpio
spi-ciena-fpga
reset_sysfs
reset_fpga
gpiotest_sysfs

# Sutra I2C client driver — provides EEPROM and other I2C sub-devices
# via ACPI matching (PRP0001:00). Must be loaded explicitly as it has
# no PCI device table for udev autoload.
sutra_i2c

# I2C userspace device nodes (/dev/i2c-*)
i2c-dev

# MTD block device layer (for rudra40-gold / rudra40-user partitions)
mtdblock
