# Ciena CN8140 module dependencies for udev-triggered loading
#
# bmc8140_uio creates platform sub-devices (CIC, thermals, fans) during
# probe and uses ciena_siril_driver_override() to synchronously bind them.
# The sub-device drivers must already be registered when device_attach() runs.
# bmc8140-gpio must be loaded so the CIC can bind its GPIO export device
# (bmc8140-gpio-dev) during probe, which registers the gpiod_lookup_table
# needed for WDT IRQ pin resolution.
softdep bmc8140_uio pre: ciena_raw_chardev bmc8140_cic bmc8140_gpio ciena_fan ciena_thermal led_sysfs

# sirilx_uio (rudra40 FPGA) creates spi-ciena-fpga platform devices during
# probe and immediately looks for the SPI master child.  The spi_ciena_fpga
# driver must be registered before the platform device is added so the probe
# runs inline.  Similarly rudra40_cic and sirilx_gpio must be present for
# CIC/GPIO sub-device binding.
softdep sirilx_uio pre: rudra40_cic sirilx_gpio spi_ciena_fpga reset_sysfs reset_fpga gpiotest_sysfs
