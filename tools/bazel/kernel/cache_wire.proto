syntax = "proto3";

package sonic.kernel.cache;

// Wire fields used by google.bytestream.ByteStream and the Remote Execution
// v2 ContentAddressableStorage service. RPC paths select the upstream services.
// https://github.com/googleapis/googleapis/blob/master/google/bytestream/bytestream.proto
// https://github.com/bazelbuild/remote-apis/blob/main/build/bazel/remote/execution/v2/remote_execution.proto
message ReadRequest {
  string resource_name = 1;
}

message ReadResponse {
  bytes data = 10;
}

message WriteRequest {
  string resource_name = 1;
  int64 write_offset = 2;
  bool finish_write = 3;
  bytes data = 10;
}

message WriteResponse {
  int64 committed_size = 1;
}

message Digest {
  string hash = 1;
  int64 size_bytes = 2;
}

message FindMissingBlobsRequest {
  repeated Digest blob_digests = 2;
  int32 digest_function = 3;
}

message FindMissingBlobsResponse {
  repeated Digest missing_blob_digests = 2;
}
