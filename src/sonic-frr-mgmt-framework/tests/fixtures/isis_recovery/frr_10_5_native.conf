! Synthetic example preserving FRR 10.5.4 native writer forms.
frr version 10.5.4
frr defaults traditional
!
hostname recovery-fixture
!
interface Ethernet0
 ipv6 router isis default
 isis network point-to-point
exit
!
router isis default
 is-type level-2-only
 net 49.0001.0000.0000.0001.00
 topology ipv6-unicast
exit
!
segment-routing
 srv6
  encapsulation
   source-address 2001:db8::1
  exit
  locators
   locator LOC1
    prefix 2001:db8:1::/48 block-len 32 node-len 16
    format usid-f3216
   exit
   !
  exit
  !
 exit
 !
exit
!
segment-routing
 srv6
  static-sids
   sid 2001:db8:1:8001::/64 locator LOC1 behavior uA interface Ethernet0 nexthop fe80::2
  exit
  !
 exit
 !
exit
!
end
