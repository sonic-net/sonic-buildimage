[package]
name = "sonic-containercfgd-rs"
version = "1.0.0"
edition = "2024"
authors = ["SONiC Team <sonic-dev@lists.sonicfoundation.dev>"]
description = "SONiC container configuration utility" 
homepage = "https://github.com/sonic-net/sonic-buildimage"
repository = "https://github.com/sonic-net/sonic-buildimage"
keywords = ["sonic", "container", "networking"]
rust-version = "1.86"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
epoll = "4.4.0"
libc = "0.2"
log = "0.4"
regex = "1.13"
swss-common = { path = "../sonic-swss-common/crates/swss-common" }
syslog-tracing = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = true

[profile.release-with-debug]
inherits = "release"
debug = true
