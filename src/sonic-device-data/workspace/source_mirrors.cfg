# Use the registry's verified mirror first on runners that cannot reach
# zlib.net. Bazel checks the BCR integrity on both routes.
rewrite zlib\.net/pigz/pigz-2\.8\.tar\.gz https://github.com/securely1g/sonic-bazel-registry/releases/download/ci-source-mirrors-20261104/pigz-2.8.tar.gz
rewrite zlib\.net/pigz/pigz-2\.8\.tar\.gz https://zlib.net/pigz/pigz-2.8.tar.gz
# Match the shared downloader policy for GitLab's short-lived release routes.
rewrite gitlab\.arm\.com/bazel/(ape|download_utils|rules_coreutils|rules_gzip|toolchain_utils)/-/releases/(v[^/]+)/downloads/src\.tar\.gz https://github.com/securely1g/sonic-bazel-registry/releases/download/ci-source-mirrors-20261104/$1-$2.tar.gz
rewrite gitlab\.arm\.com/bazel/((?:ape|download_utils|rules_coreutils|rules_gzip|toolchain_utils)/-/releases/v[^/]+/downloads/src\.tar\.gz) https://gitlab.arm.com/bazel/$1
