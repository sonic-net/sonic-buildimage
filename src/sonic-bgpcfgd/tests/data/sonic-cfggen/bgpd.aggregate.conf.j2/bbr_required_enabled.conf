!
! template: bgpd/bgpd.aggregate.conf.j2
!
!
! ---- aggregate / contributing prefix-lists (global scope) ----
ip prefix-list AGGREGATE_BBR seq 10 permit 10.0.0.0/8
ip prefix-list CONTRIBUTING_BBR seq 10 permit 10.0.0.0/8 le 32
!
! ---- aggregate-address (router bgp scope) ----
router bgp 65100
 address-family ipv4
  aggregate-address 10.0.0.0/8 summary-only
 exit-address-family
exit
!
! end of template: bgpd/bgpd.aggregate.conf.j2
!
