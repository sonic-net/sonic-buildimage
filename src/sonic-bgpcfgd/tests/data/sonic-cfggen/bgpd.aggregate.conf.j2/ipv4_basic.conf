!
! template: bgpd/bgpd.aggregate.conf.j2
!
!
! ---- aggregate / contributing prefix-lists (global scope) ----
ip prefix-list AGGREGATE_V4 seq 10 permit 192.0.2.0/24
ip prefix-list CONTRIBUTING_V4 seq 10 permit 192.0.2.0/24 le 32
!
! ---- aggregate-address (router bgp scope) ----
router bgp 65100
 address-family ipv4
  aggregate-address 192.0.2.0/24 summary-only
 exit-address-family
exit
!
! end of template: bgpd/bgpd.aggregate.conf.j2
!
