!
! template: bgpd/bgpd.aggregate.conf.j2
!
!
! ---- aggregate / contributing prefix-lists (global scope) ----
ipv6 prefix-list AGGREGATE_V6 seq 10 permit 2001:db8::/32
ipv6 prefix-list CONTRIBUTING_V6 seq 10 permit 2001:db8::/32 le 128
!
! ---- aggregate-address (router bgp scope) ----
router bgp 65100
 address-family ipv6
  aggregate-address 2001:db8::/32 summary-only
 exit-address-family
exit
!
! end of template: bgpd/bgpd.aggregate.conf.j2
!
