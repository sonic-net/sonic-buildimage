!
! template: bgpd/templates/general/instance.conf.j2
!
  neighbor PortChannel102 remote-as 65200
  neighbor PortChannel102 description T3_unnumbered_peer
  neighbor PortChannel102 timers connect 10
!
  neighbor PortChannel102 interface peer-group PEER_EXTERNAL_UNNUMBERED
  address-family ipv4
    neighbor PortChannel102 activate
  exit-address-family
  address-family ipv6
    neighbor PortChannel102 activate
  exit-address-family
!
! end of template: bgpd/templates/general/instance.conf.j2
!
