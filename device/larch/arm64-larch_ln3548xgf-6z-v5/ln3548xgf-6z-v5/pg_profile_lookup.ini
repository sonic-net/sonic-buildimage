# PG lossless profiles for buffermgrd (traditional model), Marvell Prestera xpSai, Aldrin2.
#
# xoff = ceil256( 2*MTU + 1.5 * ( (2*L*5ns + 1us) * speed/8 + peer_reaction(speed) ) )
#        MTU 9216 B, cell 256 B, peer reaction = IEEE 802.3 Table 31B-1 pause quanta x 64 B
# size = 0       xpSai: guaranteed part (xoffThreshold) of the port's PFC profile TC
# xon  = 2*MTU   stored only: xpSai sets the XON limit to the guaranteed part + half the XOFF alpha
# dynamic_th -2: PFC DBA alpha 0.25 (Aldrin2 alphas: 0.25 0.5 1 2 4), XOFF when the PG holds
#                more than 1/4 of the free PFC buffers (= ingress_lossless_pool shared size)
# Aldrin2 has 8 PFC profiles (0 = no PFC): ports share one when their PFC-enabled TCs and the
#   size/dynamic_th of those PGs are equal (all rows below are equal), up to 7 distinct sets.
# Headroom is reserved once as the pool shared headroom (BUFFER_POOL ingress_lossless_pool.xoff = 361728 B:
#   min(sum over 54 ports of xoff(speed, 40m) = 1786368, max(25% of pool 1447040 = 361728, largest xoff below))); every xoff fits in it.
#
# speed  cable  size  xon    xoff    dynamic_th
