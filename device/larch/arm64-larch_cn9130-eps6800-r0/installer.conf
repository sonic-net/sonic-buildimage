ONIE_PLATFORM_EXTRA_CMDLINE_LINUX="default_hugepagesz=32M hugepages=2 pci=noaer"

# Board setup for platform_arm64.conf (Marvell Prestera arm64 installer)
platform_arm64_select()
{
    fdt_fname="/boot/cn9130-eps6800-r0.dtb"
    fit_conf_name="#conf_cn9130-eps6800"
    fdt_addr=0x1000000
    fit_addr=0x8000000
    initrd_addr=0x2000000
    FW_ENV_DEFAULT='/dev/mtd0 0x3F0000 0x10000 0x10000'
    mmc_bus="mmc0:0001"
}

platform_arm64_boot_env()
{
    platf_custom=true
    fw_setenv ${FW_ARG} platf_custom "$platf_custom" > /dev/null
    fw_setenv ${FW_ARG} bootcmd 'run platf_custom; run print_menu; test -n "$boot_once" && setenv do_boot_once "$boot_once" && setenv boot_once "" && saveenv && run do_boot_once; run boot_next' > /dev/null
}
