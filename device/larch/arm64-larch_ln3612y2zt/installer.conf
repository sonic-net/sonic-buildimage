ONIE_PLATFORM_EXTRA_CMDLINE_LINUX="default_hugepagesz=32M hugepages=2 pci=noaer"

# Board setup for platform_arm64.conf (Marvell Prestera arm64 installer)
platform_arm64_select()
{
    fdt_fname="/boot/ln3612y2zt.dtb"
    fit_conf_name="#conf_ln3612y2zt"
    fdt_addr=0x1000000
    fit_addr=0x8000000
    initrd_addr=0x2000000
    FW_ENV_DEFAULT='/dev/mtd1 0x00000000 0x10000 0x1000'
    mmc_bus="mmc0:0001"
}

platform_arm64_boot_env()
{
    fw_setenv ${FW_ARG} set_main_flash 'i2c dev 0; i2c mw 0x72 0x0 0x01; i2c mw 0x18 0x04 0x7f' > /dev/null
    fw_setenv ${FW_ARG} set_back_flash 'i2c dev 0; i2c mw 0x72 0x0 0x01; i2c mw 0x18 0x04 0x7e' > /dev/null
    fw_setenv ${FW_ARG} check_flash    'i2c dev 0; i2c mw 0x72 0x0 0x01; i2c md 0x18 0x04 1' > /dev/null
    platf_custom=true
    fw_setenv ${FW_ARG} platf_custom "$platf_custom" > /dev/null
    fw_setenv ${FW_ARG} bootcmd 'run platf_custom; run print_menu; test -n "$boot_once" && setenv do_boot_once "$boot_once" && setenv boot_once "" && saveenv && run do_boot_once; run boot_next' > /dev/null
}
