# PG lossless profiles for buffermgrd (traditional model), Marvell Prestera xpSai.
#
# xoff = ceil128( 2*MTU + 1.5 * ( (2*L*5ns + 1us) * speed/8 + peer_reaction(speed) ) )
#        MTU 9216 B, cell 128 B, peer reaction = IEEE 802.3 Table 31B-1 pause quanta x 64 B
# size = 0      xpSai programs it as the CPSS PFC guaranteedThreshold (pure dynamic XOFF)
# xon  = 2*MTU  stored only: xpSai has no XON threshold; xon_offset is NOT_SUPPORTED by xpSai
# dynamic_th -3: PFC XOFF when the PG holds more than 1/8 of the free ingress_lossless_pool
# Headroom is reserved once as the pool shared headroom (BUFFER_POOL ingress_lossless_pool.xoff = 361728 B:
#   min(sum over 56 ports of xoff(speed, 40m) = 2405376, 25% of pool 1447040 = 361728)); every xoff below fits in it.
#
# speed  cable  size  xon    xoff    dynamic_th
