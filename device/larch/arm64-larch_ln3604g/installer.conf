ONIE_PLATFORM_EXTRA_CMDLINE_LINUX="default_hugepagesz=32M hugepages=2"

# Board setup for platform_arm64.conf (Marvell Prestera arm64 installer)
platform_arm64_select()
{
    fdt_fname="/boot/ln3604g.dtb"
    fit_conf_name="#conf_ln3604g"
    fdt_addr=0x201000000
    fit_addr=0x210000000
    initrd_addr=0x206000000
    FW_ENV_DEFAULT='/dev/mtd2 0xC0000 0x10000 0x10000'
    mmc_bus=""
}

platform_arm64_boot_env()
{
    fw_setenv ${FW_ARG} net_fix 'mii write 0 0x1f 0xdc8;mii write 0 0x14 0x2;dhcp' > /dev/null
    platf_custom='run net_fix; i2c dev 0; i2c md 0x33 0x1 0'
    fw_setenv ${FW_ARG} platf_custom "$platf_custom" > /dev/null
    fw_setenv ${FW_ARG} bootcmd 'run platf_custom; run print_menu; test -n "$boot_once" && setenv do_boot_once "$boot_once" && setenv boot_once "" && saveenv && run do_boot_once; run boot_next' > /dev/null
}
