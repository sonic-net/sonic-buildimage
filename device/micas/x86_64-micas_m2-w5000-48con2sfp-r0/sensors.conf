# sensors.conf for x86_64-micas_m2-w5000-48con2sfp-r0
#
# Hardware monitoring on this platform is provided by the S3IP/HAL
# layer (platform_sensors.py). lm-sensors only needs this file to exist;
# no chip or label overrides are required here.
#
# I2C sensors present on the board (see dev.xml / platform DEVICE table):
#   lm75-i2c-7-48       inlet temperature
#   lm75-i2c-8-49       outlet temperature
#   tmp1075-i2c-0-4a    hottest temperature
#   ucd90160-i2c-0-5f   voltage rails
#   ina3221-i2c-9-40    voltage/current rails
#   ina3221-i2c-10-41   voltage/current rails
