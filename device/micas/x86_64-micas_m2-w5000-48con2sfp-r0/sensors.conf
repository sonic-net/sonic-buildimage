# sensors.conf for x86_64-micas_m2-w5000-48con2sfp-r0
#
# Chip labels follow dev.xml and the HAL device config so that lm-sensors
# output matches the names used by sonic_platform / platform_sensors.py.

chip "k10temp-*"
    label temp1 "CPU_TEMP"

chip "lm75-i2c-7-48"
    label temp1 "INLET_TEMP"
    compute temp1 @-3, @+3

chip "lm75-i2c-8-49"
    label temp1 "OUTLET_TEMP"

chip "tmp1075-i2c-0-4a"
    label temp1 "HOTTEST_TEMP"

chip "ucd90160-i2c-0-5f"
    label in1  "VDD12V_F"
    label in2  "VCC_P5V0_DDR"
    label in3  "VDD_P1V1_V3K_MEM_S3"
    label in4  "VDD_P0V75_V3K_MISC_S5"
    label in5  "VDD_P3V3_V3K_S5"
    label in6  "VDD_P1V8_V3K_S5"
    label in11 "VDD_P0V78_V3K_MEM_S0"
    label in12 "VDD_P0V75_V3K_MISC_S0"
    label in13 "VDD_P3V3_V3K_S0"
    label in14 "VDD_P1V8_V3K_S0"
    label in15 "VDD_VR_P1V0_V3K_CORE"

chip "ina3221-i2c-9-40"
    label in1   "CTL_VDD3.3_V"
    label in2   "VDD3.3_V"
    label in3   "SFP_VDD3.3_V"
    label curr1 "CTL_VDD3.3_C"
    label curr2 "VDD3.3_C"
    label curr3 "SFP_VDD3.3_C"

chip "ina3221-i2c-10-41"
    label in1   "PSU1_Output_V"
    label in2   "PSU2_Output_V"
    label in3   "VDD1.8_V"
    label curr1 "PSU1_Output_C"
    label curr2 "PSU2_Output_C"
