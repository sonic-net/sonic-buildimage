# libsensors configuration for x86_64-ciena-8140-r0
#
# Temperature sensor topology (BMC I2C):
#   TMP421 @ 0x4C - Ambient sensor board (faceplate inlet)
#   TMP421 @ 0x2A - Main board: near right side of PCB
#   TMP421 @ 0x4D - Main board: between two J2C+ devices
#   TMP421 @ 0x4E - Main board: exhaust sensor (near fans)
#   TMP421 @ 0x4F - Main board: near left side of PCB
#   TMP421 @ 0x1C - CPU board: near DIMMs
#   TMP421 @ 0x1D - CPU board: near M.2
#   TMP421 @ 0x1E - CPU board: exhaust sensor (near fans)
#   TMP421 @ 0x1F - CPU board: inlet sensor
#   PM8532 PCIe switch: internal thermal diode (remote via TMP421)
#   J2C+ A/B: internal thermal monitors (via SDK/PCIe)
#   CPU: die temperature (via PECI)
# ------------------------------------------------

# -----------------------------------------------
# Ambient (Faceplate Inlet) Temperature Sensor
# -----------------------------------------------

chip "tmp421-i2c-*-4c"
    label temp1 "Ambient Inlet Local Temp"
    label temp2 "Ambient Inlet Remote Temp"
    set temp1_max 55
    set temp1_crit 65

# -----------------------------------------------
# Main Board Temperature Sensors
# -----------------------------------------------

chip "tmp421-i2c-*-2a"
    label temp1 "MB Right Side Local Temp"
    label temp2 "MB Right Side Remote Temp"
    set temp1_max 75
    set temp1_crit 85

chip "tmp421-i2c-*-4d"
    label temp1 "MB Near J2C+ Local Temp"
    label temp2 "MB Near J2C+ Remote Temp"
    set temp1_max 85
    set temp1_crit 95

chip "tmp421-i2c-*-4e"
    label temp1 "MB Exhaust Local Temp"
    label temp2 "MB Exhaust Remote Temp"
    set temp1_max 70
    set temp1_crit 80

chip "tmp421-i2c-*-4f"
    label temp1 "MB Left Side Local Temp"
    label temp2 "MB Left Side Remote Temp"
    set temp1_max 75
    set temp1_crit 85

# -----------------------------------------------
# CPU Board Temperature Sensors
# -----------------------------------------------

chip "tmp421-i2c-*-1c"
    label temp1 "CPU Board DIMMs Local Temp"
    label temp2 "CPU Board DIMMs Remote Temp"
    set temp1_max 80
    set temp1_crit 90

chip "tmp421-i2c-*-1d"
    label temp1 "CPU Board M.2 Local Temp"
    label temp2 "CPU Board M.2 Remote Temp"
    set temp1_max 75
    set temp1_crit 85

chip "tmp421-i2c-*-1e"
    label temp1 "CPU Board Exhaust Local Temp"
    label temp2 "CPU Board Exhaust Remote Temp"
    set temp1_max 70
    set temp1_crit 80

chip "tmp421-i2c-*-1f"
    label temp1 "CPU Board Inlet Local Temp"
    label temp2 "CPU Board Inlet Remote Temp"
    set temp1_max 65
    set temp1_crit 75

# -----------------------------------------------
# PCIe Switch (PM8532) Temperature
# -----------------------------------------------

chip "tmp421-i2c-*-1f"
    label temp2 "PCIe Switch Remote Temp"

# -----------------------------------------------
# CPU Die Temperature (Intel Ice Lake D-1749NT)
# coretemp driver, per-core DTS readings
# -----------------------------------------------

# -----------------------------------------------
# NVMe SSD (M.2)
# -----------------------------------------------
# The nvme hwmon driver registers 8 temp slots; only temp1-temp7 are
# populated on this hardware. Suppress temp8 to eliminate the periodic
# "nvme/#7: I/O error" log spam from lm-sensors / sensormond.
chip "nvme-pci-*"
    label temp1 "NVMe Composite Temp"
    label temp2 "NVMe Sensor 1"
    label temp3 "NVMe Sensor 2"
    label temp4 "NVMe Sensor 3"
    label temp5 "NVMe Sensor 4"
    label temp6 "NVMe Sensor 5"
    label temp7 "NVMe Sensor 6"
    ignore temp8

chip "coretemp-isa-0000"
    label temp1 "CPU Package Temp"
    label temp2 "CPU Core 0 Temp"
    label temp3 "CPU Core 1 Temp"
    label temp4 "CPU Core 2 Temp"
    label temp5 "CPU Core 3 Temp"
    label temp6 "CPU Core 4 Temp"
    label temp7 "CPU Core 5 Temp"
    label temp8 "CPU Core 6 Temp"
    label temp9 "CPU Core 7 Temp"
    label temp10 "CPU Core 8 Temp"
    label temp11 "CPU Core 9 Temp"
