bus "i2c-7" "SCD 0000:03:00.0 SMBus master 0 bus 0"
bus "i2c-15" "SCD 0000:03:00.0 SMBus master 1 bus 0"
bus "i2c-18" "SCD 0000:03:00.0 SMBus master 1 bus 3"
bus "i2c-23" "i2c-17-mux (chan_id 0)"
bus "i2c-24" "i2c-17-mux (chan_id 1)"
bus "i2c-25" "i2c-17-mux (chan_id 2)"
bus "i2c-26" "i2c-17-mux (chan_id 3)"

chip "k10temp-pci-00c3"
    label temp1 "Cpu"

chip "max6581-i2c-15-4d"
    label temp1 "Board Front Bottom"
    label temp2 "TH6 on-die sensor 1"
    label temp3 "TH6 on-die sensor 2"
    label temp5 "Banff Board Front 1"
    label temp6 "Banff Board Front 2"
    label temp7 "Banff Board Rear 1"
    label temp8 "Banff Board Rear 2"
    ignore temp4

chip "tmp75-i2c-7-48"
    label temp1 "Primary Inlet Sensor"

chip "nvme-pci-*"
    ignore temp2
    ignore temp3
    ignore temp4
    ignore temp5
    ignore temp6
    ignore temp7
    ignore temp8

chip "dps800-i2c-23-58"
    ignore fan3
    ignore fan4

chip "pmbus-i2c-23-58"
    ignore fan3
    ignore fan4

chip "dps800-i2c-24-58"
    ignore fan3
    ignore fan4

chip "pmbus-i2c-24-58"
    ignore fan3
    ignore fan4

chip "dps800-i2c-25-58"
    ignore fan3
    ignore fan4

chip "pmbus-i2c-25-58"
    ignore fan3
    ignore fan4

chip "dps800-i2c-26-58"
    ignore fan3
    ignore fan4

chip "pmbus-i2c-26-58"
    ignore fan3
    ignore fan4
