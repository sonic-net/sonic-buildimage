bus "i2c-7" "SCD 0000:02:00.0 SMBus master 0 bus 0"
bus "i2c-15" "SCD 0000:05:00.0 SMBus master 0 bus 0"
bus "i2c-17" "SCD 0000:05:00.0 SMBus master 0 bus 2"
bus "i2c-18" "SCD 0000:05:00.0 SMBus master 0 bus 3"
bus "i2c-19" "SCD 0000:05:00.0 SMBus master 0 bus 4"

chip "k10temp-pci-00c3"
    label temp1 "Cpu temp sensor"

chip "tmp75-i2c-7-48"
    label temp1 "Cpu board temp sernsor"

chip "tmp75-i2c-15-48"
    label temp1 "Inlet Ambient Air"

chip "raa228228-i2c-19-45"
    label temp1 "0V8_Core"
    ignore temp2
    ignore temp3

chip "isl68226-i2c-19-54"
    label temp1 "3V3_Port_RT"
    label temp2 "0V75_TH5_0"
    label temp3 "0V9_TH5_0"
    ignore temp4
    ignore temp5
    ignore temp6
    ignore temp7

chip "isl68226-i2c-19-60"
    label temp1 "3V3_Port_LT"
    label temp2 "0V75_TH5_1"
    label temp3 "0V9_TH5_1"
    ignore temp4
    ignore temp5
    ignore temp6
    ignore temp7

chip "pmbus-i2c-17-58"
    ignore fan3
    ignore fan4

chip "pmbus-i2c-18-58"
    ignore fan3
    ignore fan4

chip "nvme-pci-0400"
    # TODO: sensors complaining about tempX_min and tempX_max
    ignore temp2
    ignore temp3
    ignore temp4
    ignore temp5
    ignore temp6
    ignore temp7
