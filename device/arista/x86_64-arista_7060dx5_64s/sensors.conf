# libsensors configuration file for DCS-7060DX5-64S
# ------------------------------------------------#

bus "i2c-19" "SCD 0000:01:00.0 SMBus master 1 bus 0"
bus "i2c-22" "SCD 0000:01:00.0 SMBus master 1 bus 3"
bus "i2c-23" "SCD 0000:01:00.0 SMBus master 1 bus 4"
bus "i2c-24" "SCD 0000:01:00.0 SMBus master 1 bus 5"
bus "i2c-37" "SCD 0000:01:00.0 SMBus master 2 bus 0"
bus "i2c-38" "SCD 0000:01:00.0 SMBus master 2 bus 1"
bus "i2c-39" "SCD 0000:01:00.0 SMBus master 2 bus 2"
bus "i2c-40" "SCD 0000:01:00.0 SMBus master 2 bus 3"
bus "i2c-107" "SCD 0000:00:18.7 SMBus master 0 bus 0"

chip "tmp464-i2c-19-48"
    label temp1 "Switch card"
    label temp2 "Air outlet"
    label temp3 "Air inlet"
    ignore temp4
    ignore temp5
    ignore temp6
    ignore temp7
    ignore temp8
    ignore temp9

chip "dps800-i2c-22-58"
    label temp1 "Power supply 1 hotspot sensor"
    label temp2 "Power supply 1 inlet temp sensor"
    ignore temp3

    ignore fan2
    ignore fan3
    ignore fan4

chip "dps800-i2c-23-58"
    label temp1 "Power supply 2 hotspot sensor"
    label temp2 "Power supply 2 inlet temp sensor"
    ignore temp3

    ignore fan2
    ignore fan3
    ignore fan4

chip "lm73-i2c-24-48"
    label temp1 "Front-panel temp sensor"

chip "raa228228-i2c-37-45"
    label temp1 "POS0V8_VDD"
    ignore temp2
    ignore temp3

chip "isl68226-i2c-38-46"
    label temp1 "P0V75_AVDD_0"
    label temp2 "P0V75_AVDD_1"
    label temp3 "P0V75_AVDD_2"
    ignore temp4
    ignore temp5
    ignore temp6
    ignore temp7

chip "isl68226-i2c-39-47"
    label temp1 "P3V3_OPTICS_A"
    ignore temp2
    ignore temp3
    ignore temp4
    ignore temp5
    ignore temp6
    ignore temp7

chip "isl68226-i2c-40-4c"
    label temp1 "P3V3_OPTICS_B"
    ignore temp2
    ignore temp3
    ignore temp4
    ignore temp5
    ignore temp6
    ignore temp7

chip "max6658-i2c-107-4c"
    label temp1 "CPU board temp sensor"
    label temp2 "Back-panel temp sensor"

chip "k10temp-pci-00c3"
    label temp1 "Cpu temp sensor"
