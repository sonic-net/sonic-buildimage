bus "i2c-25" "SCD 0000:03:00.0 SMBus master 1 bus 0"
bus "i2c-28" "SCD 0000:03:00.0 SMBus master 1 bus 3"
bus "i2c-29" "SCD 0000:03:00.0 SMBus master 1 bus 4"
bus "i2c-33" "SCD 0000:03:00.0 SMBus master 2 bus 0"
bus "i2c-34" "SCD 0000:03:00.0 SMBus master 2 bus 1"
bus "i2c-35" "SCD 0000:03:00.0 SMBus master 2 bus 2"
bus "i2c-36" "SCD 0000:03:00.0 SMBus master 2 bus 3"
bus "i2c-37" "SCD 0000:03:00.0 SMBus master 2 bus 4"

chip "max6581-i2c-25-4d"
