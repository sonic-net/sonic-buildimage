is_ltsw_chip=1
# linux_ngknet caps its netdevs' MTU at rx_buffer_size - 18 (Ethernet header
# and FCS). opennsl-modules loads it with 9216 unless told otherwise, which
# caps them at 9198, so a 9216 port MTU is set in the ASIC but refused on the
# netdev. 9238 is MTU 9216 plus Ethernet, VLAN tag and FCS, and is what
# opennsl-modules already passes to the older linux-bcm-knet driver.
rx_buffer_size=9238
SYNCD_SHM_SIZE=1g
switch_host=1
