# libsensors configuration file
# ----------------------------------------------
chip "k10temp-pci-*"
    label temp1 "CPU"

chip "nvme-pci-*"
    ignore temp2
    ignore temp3
    ignore temp4

chip "tmp464-*"
    ignore temp6
    ignore temp7
    ignore temp8
    ignore temp9

chip "tmp464-i2c-*-48"
    label temp1 "Switch Card Temp 0"
    label temp2 "Switch Card Temp 2"
    label temp3 "ASIC Diode 0"
    label temp4 "ASIC Diode 1"
    label temp5 "ASIC Diode 2"

chip "tmp464-i2c-*-49"
    label temp1 "Switch Card Temp 1"
    label temp2 "Switch Card Temp 3"
    label temp3 "Switch Card Temp 4"
    label temp4 "Switch Card Temp 5"
    label temp5 "Switch Card Temp 6"

chip "tmp451-*"
    ignore temp1
    label temp2 "MGMT Card Board Temperature"

chip "xdpe1a2g5b-*"
    set temp1_max 120
    set temp1_crit 130

chip "raa228234-*"
    set temp1_max 120
    set temp1_crit 130

chip "raa228236-*"
    compute in3 @*(1.2), @/(1.2)
    set temp1_max 120
    set temp1_crit 130

chip "tmp175-i2c-*-37"
    label temp1 "PDC Board Temp 0"

chip "tmp175-i2c-*-35"
    label temp1 "PDC Board Temp 1"
