# Console configuration for NVIDIA AST2700 BMC platform.
# CONSOLE_SPEED only seeds U-Boot `baudrate` on a blank environment; the live
# value is `baudrate` itself (fw_setenv baudrate <N>).
CONSOLE_DEV=12
CONSOLE_SPEED=115200
# No baud option: earlycon inherits U-Boot's divisor. A bare "earlycon" would
# take port and rate from the DTB instead.
EARLYCON="earlycon=uart8250,mmio32,0x14c33b00"

# Variable log size(MB)
VAR_LOG_SIZE=512

# Additional kernel command line arguments
ONIE_PLATFORM_EXTRA_CMDLINE_LINUX=""

bootconf="sonic-ast2700-nvidia-spc6-bmc"
