# Console configuration for the NVIDIA AST2700 BMC platform.
# Consumed by sonic-switchcpu-console-init.sh to populate CONSOLE_PORT|0.

# Switch CPU console baud rate
CONSOLE_BAUD_RATE=115200

# Flow control: 0=disabled, 1=enabled
CONSOLE_FLOW_CONTROL=0

# Remote device name shown in `show line`
CONSOLE_REMOTE_DEVICE=SwitchCpu
