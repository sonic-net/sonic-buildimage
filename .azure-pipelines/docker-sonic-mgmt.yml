# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml
# Build and push sonic-mgmt image

schedules:
- cron: "0 8 * * *"
  branches:
    include:
    - 202605
  always: true

trigger: none
pr:
  branches:
    include:
    - 202605
  paths:
    include:
    - dockers/docker-sonic-mgmt
    - rules/docker-sonic-mgmt.dep
    - rules/docker-sonic-mgmt.mk
    - .azure-pipelines/docker-sonic-mgmt.yml

resources:
  repositories:
  - repository: sonic-mgmt
    type: github
    name: sonic-net/sonic-mgmt
    ref: 202605
    endpoint: sonic-net

parameters:
- name: registry_url
  type: string
  default: sonicdev-microsoft.azurecr.io
- name: registry_conn
  type: string
  default: sonicdev

stages:
- stage: Build
  jobs:
  - job: Build
    pool: sonicso1ES-amd64
    timeoutInMinutes: 360
    steps:
    - template: cleanup.yml
    - checkout: self
      clean: true
    - script: |
        set -x
        sudo setfacl -R -b $(Agent.BuildDirectory)
      displayName: 'setfacl'

    - bash: |
        set -xe
        git submodule update --init --recursive -- src/sonic-platform-daemons src/sonic-genl-packet src/sonic-sairedis src/ptf src/sonic-device-data src/sonic-dash-api

        make NOBUSTER=1 NOBULLSEYE=1 SONIC_BUILD_JOBS=$(nproc) DEFAULT_CONTAINER_REGISTRY=publicmirror.azurecr.io ENABLE_DOCKER_BASE_PULL=y ENABLE_SBOM=y configure PLATFORM=generic DOCKER_BUILDKIT=0
        make -f Makefile.work BLDENV=bookworm SONIC_BUILD_JOBS=$(nproc) DEFAULT_CONTAINER_REGISTRY=publicmirror.azurecr.io ENABLE_DOCKER_BASE_PULL=y ENABLE_SBOM=y target/docker-sonic-mgmt.gz
        cp -r target $(Build.ArtifactStagingDirectory)/target
      env:
        REGISTRY_SERVER: ${{ parameters.registry_url }}
      displayName: Build docker-sonic-mgmt.gz

    - publish:  $(Build.ArtifactStagingDirectory)
      artifact: 'docker-sonic-mgmt'
      displayName: "Archive docker image sonic-mgmt"

    - bash: |
        set -ex
        docker load -i $(Build.ArtifactStagingDirectory)/target/docker-sonic-mgmt.gz
        docker run --rm docker-sonic-mgmt:latest uv --version 2>&1 | grep -Eq '^uv 0\.12\.10( |$)'
        test "$(docker run --rm docker-sonic-mgmt:latest ghz --version 2>&1)" = v0.121.0
        docker run --rm docker-sonic-mgmt:latest sh -c "
          test \"\$(cat /usr/local/share/sonic-mgmt/ghz/version)\" = v0.121.0 &&
          test \"\$(cat /usr/local/share/sonic-mgmt/ghz/source-commit)\" = b7ca8f5fad40d3da97092a8886e4a4f636712069 &&
          echo 'e5d9f9f5170290d2b2ca325b8fe5ba85a490f4cda5a50a4490c41712594471ff  /usr/local/share/sonic-mgmt/ghz/go.mod' | sha256sum -c - &&
          echo '432d3afe684ed65c25d4857ac628314a4e4e62bfea8fd7cea1c23efd4b6d8437  /usr/local/share/sonic-mgmt/ghz/go.sum' | sha256sum -c - &&
          grep -q '^/out/bin/ghz: go1.27.1$' /usr/local/share/sonic-mgmt/ghz/buildinfo &&
          grep -q 'google.golang.org/grpc.*v1.83.2' /usr/local/share/sonic-mgmt/ghz/buildinfo &&
          grep -q 'golang.org/x/crypto.*v0.56.0' /usr/local/share/sonic-mgmt/ghz/buildinfo &&
          test -s /usr/local/share/licenses/uv/uv-LICENSE-MIT &&
          test -s /usr/local/share/licenses/uv/uv-LICENSE-APACHE &&
          test -s /usr/local/share/licenses/ghz/LICENSE &&
          test \"\$(wc -l < /usr/local/share/licenses/ghz/DEPENDENCIES)\" -eq 57 &&
          test -s /usr/local/share/licenses/ghz/dependencies/go1.27.1/LICENSE &&
          test -s /usr/local/share/licenses/ghz/dependencies/google.golang.org/grpc@v1.83.2/LICENSE &&
          test -s /usr/local/share/licenses/ghz/dependencies/google.golang.org/grpc@v1.83.2/NOTICE.txt &&
          test -s /usr/local/share/licenses/ghz/dependencies/golang.org/x/crypto@v0.56.0/LICENSE &&
          test -s /usr/local/share/licenses/ghz/dependencies/github.com/jinzhu/configor@v1.2.1/LICENSE &&
          test -s /usr/local/share/licenses/openconfig-gnmi/LICENSE &&
          echo '08d8f03b70d80e22b36246c4534620cc2d8592ef89dffdd51ccc33c2e76acb39  /usr/local/share/sonic-mgmt/gnmi.protoset' | sha256sum -c -"
        python3 -c "import json; d=json.load(open('target/docker-sonic-mgmt.gz.sbom.cdx.json')); p={c.get('purl') for c in d.get('components', [])}; assert 'pkg:golang/google.golang.org/grpc@v1.83.2' in p and 'pkg:golang/golang.org/x/crypto@v0.56.0' in p"
        docker tag docker-sonic-mgmt:latest $REGISTRY_SERVER/docker-sonic-mgmt:202605-lastbuild
        docker images
      env:
        REGISTRY_SERVER: ${{ parameters.registry_url }}
      displayName: 'Load and tag docker-sonic-mgmt as 202605-lastbuild'

    - task: Docker@2
      displayName: 'Push docker-sonic-mgmt:202605-lastbuild to registry'
      condition: succeeded()
      inputs:
        containerRegistry: ${{ parameters.registry_conn }}
        repository: docker-sonic-mgmt
        command: push
        tags: 202605-lastbuild

- stage: Test
  dependsOn: Build
  condition: and(succeeded(), in(dependencies.Build.result, 'Succeeded'))
  variables:
  - group: SONiC-Elastictest
  - name: BUILD_BRANCH
    value: $(Build.SourceBranchName)
  jobs:
  - job: sbom_vuln_scan
    displayName: "[OPTIONAL] SBOM-based vulnerability scan (docker-sonic-mgmt)"
    # The SBOM is produced by the Build stage (ENABLE_SBOM=y); this job
    # scans it with grype and reports CVEs. Informational only
    # (continueOnError: true) so findings do not block the pipeline.
    pool: sonic-ubuntu-1c
    continueOnError: true
    timeoutInMinutes: 30
    steps:
    - checkout: self
      clean: true
      fetchDepth: 1
    - download: current
      artifact: docker-sonic-mgmt
      displayName: "Download docker-sonic-mgmt artifact (includes SBOM)"
    - script: |
        set -ex
        sudo apt-get install -y jq
      displayName: "Install dependencies"
    - script: |
        set -x
        SBOM=$(Pipeline.Workspace)/docker-sonic-mgmt/target/docker-sonic-mgmt.gz.sbom.cdx.json
        if [ ! -f "$SBOM" ]; then
          echo "::error::SBOM not found at $SBOM — was the build invoked with ENABLE_SBOM=y?"
          ls -la $(Pipeline.Workspace)/docker-sonic-mgmt/target/ | head -30
          exit 1
        fi
        echo "SBOM: $SBOM"
        echo "Component count: $(jq '.components | length' "$SBOM")"
      displayName: "Verify SBOM artifact is present"
    - script: |
        set -x
        # Mirror the prior trivy policy: report MEDIUM/HIGH/CRITICAL,
        # filter to fixed CVEs only, fail the job on any unsuppressed
        # finding. VEX statements under vex/ are applied first.
        REPORT=$(Build.ArtifactStagingDirectory)/sbom-vuln-sonic-mgmt
        python3 scripts/sbom_vuln_scan.py \
          --vex vex \
          --min-severity medium \
          --fail-on medium \
          --format both \
          --output "${REPORT}.cdx.json" \
          $(Pipeline.Workspace)/docker-sonic-mgmt/target/docker-sonic-mgmt.gz.sbom.cdx.json \
          | tee "${REPORT}.txt"
        EXIT=${PIPESTATUS[0]}
        echo ""
        echo "=== SBOM vulnerability scan results (docker-sonic-mgmt) ==="
        echo "Full CycloneDX VEX report: ${REPORT}.cdx.json"
        echo "Human-readable table:      ${REPORT}.txt"
        exit $EXIT
      displayName: "SBOM vulnerability scan (docker-sonic-mgmt)"
    - publish: $(Build.ArtifactStagingDirectory)
      artifact: sbom-vuln-scan-results
      displayName: "Publish SBOM vuln-scan results"
      condition: always()
      continueOnError: true

  - template: .azure-pipelines/pr_test_template.yml@sonic-mgmt
    parameters:
      CHECKOUT_SONIC_MGMT: true
      # todo: enable vpp build in sonic-mgmt docker image build pipeline, and add vpp test pipeline back.
      INCLUDE_JOBS: "all"
      OVERRIDE_PARAMS:
        REPO_NAME: "sonic-mgmt"
        SETUP_CONTAINER_PARAMS: "-i ${{ parameters.registry_url }}/docker-sonic-mgmt:202605-lastbuild"

- stage: Publish
  dependsOn: Test
  condition: and(not(canceled()), in(dependencies.Test.result, 'Succeeded', 'SucceededWithIssues'))
  jobs:
  - job: PublishAsLatest
    pool: sonicso1ES-amd64
    timeoutInMinutes: 60
    steps:
    - download: current
      artifact: 'docker-sonic-mgmt'
      displayName: "Download docker-sonic-mgmt image"

    - bash: |
        set -ex
        docker load -i $(Pipeline.Workspace)/docker-sonic-mgmt/target/docker-sonic-mgmt.gz
        docker tag docker-sonic-mgmt:latest $REGISTRY_SERVER/docker-sonic-mgmt:202605
        docker images
      env:
        REGISTRY_SERVER: ${{ parameters.registry_url }}
      displayName: 'Load and tag docker-sonic-mgmt as 202605'

    - task: Docker@2
      displayName: 'Push docker-sonic-mgmt:202605 to registry'
      condition: succeeded()
      inputs:
        containerRegistry: ${{ parameters.registry_conn }}
        repository: docker-sonic-mgmt
        command: push
        tags: 202605
