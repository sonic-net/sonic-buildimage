name: BaselineTest_$(Build.DefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

schedules:
  - cron: "0 8 * * *"
    displayName: Baseline test Scheduler
    branches:
      include:
        - master
    always: true

resources:
  repositories:
  - repository: sonic-mgmt
    type: github
    name: sonic-net/sonic-mgmt
    ref: master
    endpoint: sonic-net
  - repository: buildimage
    type: github
    name: sonic-net/sonic-buildimage
    endpoint: sonic-net
    ref: master

parameters:
  - name: BUILD_REASON
    type: string
    default: "BaselineTest"

  - name: TEST_PLAN_NUM
    type: string
    default: $(BASELINE_MGMT_PUBLIC_MASTER_TEST_NUM)

  - name: RETRY_TIMES
    type: string
    default: "0"

  - name: TEST_PLAN_STOP_ON_FAILURE
    type: string
    default: "False"

  - name: CHECKOUT_SONIC_MGMT
    type: boolean
    default: true

  - name: INCLUDE_JOBS
    type: string
    default: "all"

variables:
- template: ../azure-pipelines-repd-build-variables.yml
- template: ../template-variables.yml
- group: SONiC-Elastictest
- group: GIT_SECRETS
- name: CACHE_MODE
  value: rcache
- name: ENABLE_FIPS
  value: y
- name: BUILD_BRANCH
  ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    value: $(System.PullRequest.TargetBranch)
  ${{ else }}:
    value: $(Build.SourceBranchName)

stages:
  - stage: BuildVS
    pool: sonicso1ES-amd64
    jobs:
    - template: ../azure-pipelines-build.yml
      parameters:
        buildOptions: 'USERNAME=admin SONIC_BUILD_JOBS=$(nproc) BUILD_MULTIASIC_KVM=y INCLUDE_DHCP_SERVER=y ${{ variables.VERSION_CONTROL_OPTIONS }}'
        jobGroups:
        - name: vs
    - template: ../azure-pipelines-build.yml
      parameters:
        buildOptions: 'USERNAME=admin SONIC_BUILD_JOBS=$(nproc) ${{ variables.VERSION_CONTROL_OPTIONS }}'
        jobGroups:
        - name: vpp

  - stage: Test_round_1
    dependsOn: BuildVS
    condition: and(succeeded(), and(ne(stageDependencies.BuildVS.outputs['vs.SetVar.SKIP_VSTEST'], 'YES'), in(dependencies.BuildVS.result, 'Succeeded', 'SucceededWithIssues')))
    jobs:
    - template: .azure-pipelines/pr_test_template.yml@sonic-mgmt
      parameters:
        BUILD_REASON: ${{ parameters.BUILD_REASON }}
        RETRY_TIMES: ${{ parameters.RETRY_TIMES }}
        STOP_ON_FAILURE: ${{ parameters.TEST_PLAN_STOP_ON_FAILURE }}
        TEST_PLAN_NUM: ${{ parameters.TEST_PLAN_NUM }}
        CHECKOUT_SONIC_MGMT: ${{ parameters.CHECKOUT_SONIC_MGMT }}
        INCLUDE_JOBS: ${{ parameters.INCLUDE_JOBS }}

  - stage: Test_round_2
    dependsOn:
    - Test_round_1
    condition: succeededOrFailed('Test_round_1')
    jobs:
    - template: .azure-pipelines/pr_test_template.yml@sonic-mgmt
      parameters:
        BUILD_REASON: ${{ parameters.BUILD_REASON }}
        RETRY_TIMES: ${{ parameters.RETRY_TIMES }}
        STOP_ON_FAILURE: ${{ parameters.TEST_PLAN_STOP_ON_FAILURE }}
        TEST_PLAN_NUM: ${{ parameters.TEST_PLAN_NUM }}
        CHECKOUT_SONIC_MGMT: ${{ parameters.CHECKOUT_SONIC_MGMT }}
        INCLUDE_JOBS: ${{ parameters.INCLUDE_JOBS }}

  - stage: Test_round_3
    dependsOn:
    - Test_round_2
    condition: succeededOrFailed('Test_round_2')
    jobs:
    - template: .azure-pipelines/pr_test_template.yml@sonic-mgmt
      parameters:
        BUILD_REASON: ${{ parameters.BUILD_REASON }}
        RETRY_TIMES: ${{ parameters.RETRY_TIMES }}
        STOP_ON_FAILURE: ${{ parameters.TEST_PLAN_STOP_ON_FAILURE }}
        TEST_PLAN_NUM: ${{ parameters.TEST_PLAN_NUM }}
        CHECKOUT_SONIC_MGMT: ${{ parameters.CHECKOUT_SONIC_MGMT }}
        INCLUDE_JOBS: ${{ parameters.INCLUDE_JOBS }}

  - stage: Test_round_4
    dependsOn:
    - Test_round_3
    condition: succeededOrFailed('Test_round_3')
    jobs:
    - template: .azure-pipelines/pr_test_template.yml@sonic-mgmt
      parameters:
        BUILD_REASON: ${{ parameters.BUILD_REASON }}
        RETRY_TIMES: ${{ parameters.RETRY_TIMES }}
        STOP_ON_FAILURE: ${{ parameters.TEST_PLAN_STOP_ON_FAILURE }}
        TEST_PLAN_NUM: ${{ parameters.TEST_PLAN_NUM }}
        CHECKOUT_SONIC_MGMT: ${{ parameters.CHECKOUT_SONIC_MGMT }}
        INCLUDE_JOBS: ${{ parameters.INCLUDE_JOBS }}

  - stage: NotifyFailure
    displayName: Notify baseline pipeline failure
    dependsOn:
    - BuildVS
    - Test_round_1
    - Test_round_2
    - Test_round_3
    - Test_round_4
    condition: failed()
    pool: sonic-ubuntu-1c
    variables:
    - group: sonicbld
    jobs:
    - job: Notify
      displayName: Send failure notification
      timeoutInMinutes: 5
      steps:
      - checkout: none
      - bash: |
          set +x
          set -euo pipefail

          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends jq
          fi

          cert=$(printf '%s' "$CERT" | base64 -d |
            openssl pkcs12 -nokeys -nodes -passin pass: |
            openssl x509 -noout -fingerprint -sha1 |
            sed 's/^.*=//' | tr -d ':' | tr 'A-Z' 'a-z')
          if [[ ! "$cert" =~ ^[0-9a-f]{40}$ ]]; then
            echo "##vso[task.logissue type=error]Invalid notification certificate thumbprint"
            exit 1
          fi

          payload=$(jq -cn \
            --arg name "baseline_pipeline_failure" \
            --arg pipeline "$BUILD_DEFINITIONNAME" \
            --arg url "${SYSTEM_COLLECTIONURI}${SYSTEM_TEAMPROJECTID}/_build/results?buildId=${BUILD_BUILDID}" \
            '{name: $name, pipeline: $pipeline, url: $url}')
          response=$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            -H 'Content-Type: application/json' \
            -H "thumbprint: $cert" \
            -X POST https://notice-center.azurewebsites.net/noti_center/notice \
            -d "$payload")
          if ! printf '%s' "$response" | jq -e '.success == true' >/dev/null; then
            echo "##vso[task.logissue type=error]Notice-center did not confirm the failure notification"
            printf 'Notice-center response: %s\n' "$response" >&2
            exit 1
          fi
        displayName: Notify notice-center
        env:
          CERT: $(cert-noti)
