# Sends each installer image's SBOM to OpenPSIRT after the image is archived.
#
# Runs as a postStep, after target/ has been moved to the artifact staging
# directory. The branch the build ran from is the OpenPSIRT stream, so a
# nightly of master and one of a release branch are tracked separately.
#
# OPENPSIRT_URL and OPENPSIRT_API_KEY come from the OpenPSIRT variable group,
# which the official build's stage links. The key is scoped to the product,
# so one key covers every branch and image. Without both the step uploads
# nothing.
#
# The script exits 0 whatever happens and reports problems as warnings, so
# the build result is never changed by an upload. continueOnError and the
# timeout cover the script itself failing. Pull request, armhf and cross
# builds do not run it: armhf produces no SBOM, and a cross build makes the
# same image as the native definition for the same platform.

steps:
- bash: ./scripts/sbom_upload_openpsirt.sh "$(Build.ArtifactStagingDirectory)/target"
  displayName: "Upload SBOMs to OpenPSIRT"
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), ne(variables['PLATFORM_ARCH'], 'armhf'), not(contains(variables['Build.DefinitionName'], 'cross')))
  continueOnError: true
  timeoutInMinutes: 20
  env:
    OPENPSIRT_URL: $(OPENPSIRT_URL)
    OPENPSIRT_API_KEY: $(OPENPSIRT_API_KEY)
    OPENPSIRT_BRANCH: $(Build.SourceBranch)
