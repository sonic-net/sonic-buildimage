# Tail console-monitor session I/O logs and feed them into rsyslog.
#
# console-monitor clones tty I/O to a per-line log file (default
# /var/log/console-<line>.log, or a custom path from
# "config console logging <line> filename ..."). On BMC /var/log is tmpfs,
# so local files do not survive reboot.
#
# This drop-in loads imfile and keeps console-monitor-logging messages
# out of /var/log/syslog. DCE writes
# /etc/rsyslog.d/11-console-logging-files.conf at runtime with one
# imfile input per enabled log_file
# (Tag=console-monitor-logging-<link_id>:). File= paths and Tag link_ids
# are validated before interpolation.
#
# A single File glob cannot set a different Tag per line, so inputs are
# generated per link_id. rsyslog is restarted only when that drop-in
# content changes.
#
# TTY control characters are left as-is. rsyslog's default
# parser.escapeControlCharactersOnReceive renders them as #ooo
# (for example CR as #015, BEL as #007).

module(load="imfile" mode="inotify")

if ($syslogtag startswith "console-monitor-logging") then {
    stop
}
